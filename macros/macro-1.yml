fileVersion: 1
id: "1"
macroString: |2-

    {#===========================================================================
      SECTION 1: Shared setup (keep first: the aliases and nsNodeVariables are set up
      before any template code runs)
    ===========================================================================#}

    {#===========================================================================
      Aliases for advanced-strategy node types: columns, storageLocations, config,
      sources, node and parameters point at desiredState.
    ===========================================================================#}
    {%- if desiredState -%}
        {%- set columns = desiredState.columns -%}
        {%- set storageLocations = desiredState.storageLocations -%}
        {%- set config = desiredState.config -%}
        {%- set sources = desiredState.sources -%}
        {%- set node = desiredState.node -%}
        {%- set parameters = desiredState.parameters -%}
    {%- endif -%}

    {#===========================================================================
      get_materialization_type(value): normalizes @materializationType — lower case,
      spaces trimmed/collapsed ('  TABLE ' -> 'table'); '' when missing.
      Kept here because initialize_node_variables() uses it.
    ===========================================================================#}
    {%- macro get_materialization_type(value) -%}
        {{- (value | default('', true) | string).split() | join(' ') | lower -}}
    {%- endmacro -%}

    {#===========================================================================
      initialize_node_variables(nsNodeVariables): fills nsNodeVariables from
      desiredState / currentState. Called once, right below.
    ===========================================================================#}
    {%- macro initialize_node_variables(nsNodeVariables) -%}

      {#- Normalized materialization types. The run template has neither state, only node. #}
      {%- if currentState is defined and currentState -%}
        {%- set nsNodeVariables.currentMatType = get_materialization_type(currentState.node.materializationType) -%}
      {%- endif -%}
      {%- if desiredState is defined and desiredState -%}
        {%- set nsNodeVariables.desiredMatType = get_materialization_type(desiredState.node.materializationType) -%}
      {%- elif currentState is not defined and node is defined and node -%}
        {%- set nsNodeVariables.desiredMatType = get_materialization_type(node.materializationType) -%}
      {%- endif -%}

      {%- if currentState is defined and currentState -%}
        {%- set currentProject = currentState.storageLocations
                                  | selectattr('name', 'equalto', currentState.node.location.name)
                                  | map(attribute='database')
                                  | first -%}
        {%- set currentDataset = currentState.storageLocations
                                  | selectattr('name', 'equalto', currentState.node.location.name)
                                  | map(attribute='schema')
                                  | first -%}
        {%- set nsNodeVariables.currentProjectDataset = currentProject ~ '.' ~ currentDataset -%}
        {%- set nsNodeVariables.curObjectNameFullPath = ref_no_link(currentState.node.location.name, currentState.node.name) -%}
        {%- set nsNodeVariables.cloneObjectNameFullPath = ref_no_link(currentState.node.location.name, currentState.node.name ~ '_COALESCE_INTERNAL_TABLE') -%}
      {%- endif -%}

      {%- if desiredState is defined and desiredState -%}
        {%- set desiredProject = desiredState.storageLocations
                                  | selectattr('name', 'equalto', desiredState.node.location.name)
                                  | map(attribute='database')
                                  | first -%}
        {%- set desiredDataset = desiredState.storageLocations
                                  | selectattr('name', 'equalto', desiredState.node.location.name)
                                  | map(attribute='schema')
                                  | first -%}
        {%- set nsNodeVariables.desiredProjectDataset = desiredProject ~ '.' ~ desiredDataset -%}
        {%- set nsNodeVariables.desObjectNameFullPath = ref_no_link(desiredState.node.location.name, desiredState.node.name) -%}
      {%- endif -%}

      {#- Redeploy: tables are altered on the clone (renamed into place afterwards), views in place #}
      {%- if currentState is defined and currentState and desiredState is defined and desiredState -%}
        {%- set nsNodeVariables.alterObjectNameFullPath = nsNodeVariables.desObjectNameFullPath
                                                          if nsNodeVariables.desiredMatType == 'view'
                                                          else nsNodeVariables.cloneObjectNameFullPath -%}
      {%- endif -%}

      {#- Redeploy: current columns with no desired column of the same id are being dropped
          (a column without @id has its name as id, so renaming it drops and re-adds it) #}
      {%- if currentState is defined and currentState and desiredState is defined and desiredState -%}
        {%- for curCol in currentState.columns -%}
          {%- set idStillDesired = desiredState.columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
          {%- if not idStillDesired -%}
            {%- set nsNodeVariables.droppedColumns = nsNodeVariables.droppedColumns + ['`' ~ curCol.name ~ '`'] -%}
          {%- endif -%}
          {#- Same id, new name: the column is renamed (old name recorded) #}
          {%- if idStillDesired and (idStillDesired | first).name != curCol.name -%}
            {%- set nsNodeVariables.renamedColumns = nsNodeVariables.renamedColumns + ['`' ~ curCol.name ~ '`'] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
      nsNodeVariables: shared per-render state for the templates and alter_ macros
        desiredMatType / currentMatType       normalized type, '' when absent
                                              (desired falls back to node in run)
        des/curObjectNameFullPath             `PROJECT`.`DATASET`.`NAME`
        desired/currentProjectDataset         project.dataset — a dataset move recreates the table
        cloneObjectNameFullPath               <current name>_COALESCE_INTERNAL_TABLE
        alterObjectNameFullPath               what alter_ macros change: clone (table) / view
        droppedColumns / renamedColumns       backtick-quoted current column names
        tableReplaced                         set by alter_clone_swap_sql() once the clone replaced the table
        metaDataChanged                       set by the redeploy macros
    ===========================================================================#}
    {%- set nsNodeVariables = namespace(desiredMatType = "",
                                        currentMatType = "",
                                        desObjectNameFullPath = "",
                                        curObjectNameFullPath = "",
                                        desiredProjectDataset = "",
                                        currentProjectDataset = "",
                                        cloneObjectNameFullPath = "",
                                        alterObjectNameFullPath = "",
                                        droppedColumns = [],
                                        renamedColumns = [],
                                        tableReplaced = false,
                                        metaDataChanged = false) -%}
    {{- initialize_node_variables(nsNodeVariables) -}}

    {#===========================================================================
      SECTION 2: General helpers
    ===========================================================================#}

    {#===========================================================================
      drop_materialization(materialization): DROP keyword for a type, e.g. 'TABLE IF EXISTS'.
    ===========================================================================#}
    {%- macro drop_materialization(materialization) -%}
        {%- if materialization | lower in ['table', 'clone'] -%}
            TABLE IF EXISTS
        {%- elif materialization | lower == 'snapshot' -%}
            SNAPSHOT TABLE IF EXISTS
        {%- elif materialization | lower in ['view', 'authorized view'] -%}
            VIEW IF EXISTS
        {%- elif materialization | lower == 'materialized view' -%}
            MATERIALIZED VIEW IF EXISTS
        {%- elif materialization | lower == 'external table' -%}
            EXTERNAL TABLE IF EXISTS
        {%- else -%}
            TABLE IF EXISTS
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      get_boolean_config(flag): 'true' / 'false' for @flag, @flag(true) or @flag(false);
      '' when absent. Usage: get_boolean_config('truncateBefore') | trim | lower == 'true'
    ===========================================================================#}
    {%- macro get_boolean_config(flag) -%}
        {%- if config[flag] is defined -%}
            {%- if config[flag] is boolean -%}
                {{- config[flag] | trim | lower -}}
            {%- elif config[flag].parameters is defined and config[flag].parameters|length > 0 -%}
                {{- config[flag].parameters[0] | trim | lower -}}
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===================================================================================================
    Description:
    Generates a deterministic hash value by combining and hashing all column values associated with the given `hash_name` using the `@inHash` annotation.

    Input: `hash_name` (string) - The hash group identifier used in `@inHash("<hash_name>")` to group columns for hashing.

    Output: - Returns a SQL expression of type `STRING`:
            - A SHA1 hash of concatenated column values  
            - Returns `NULL` if no columns are mapped to the given hash group
    ====================================================================================================#}
    {%- macro get_hash(hash_name, algo='SHA1', delimiter='||') -%}

        {%- set cols = namespace(items=[]) -%}
        {%- set algo_upper = algo | upper -%}

        {# Collect columns participating in this hash #}
        {%- for col in sources[0].columns -%}

            {%- if col.inHash is defined -%}
                {%- for p in col.inHash -%}
                    {%- set position = p.parameters[1] | int -%}
                    {%- set hash = p.parameters[0] -%}

                    {%- if hash == hash_name -%}
                        {%- set cols.items = cols.items + [{
                            "position": position,
                            "column": get_source_transform(col)
                        }] -%}
                    {%- endif -%}
                {%- endfor -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if cols.items | length == 0 -%}
            NULL
        {%- else -%}
            {%- set sorted_cols = cols.items | sort(attribute='position') -%}
            {# Define algo wrappers #}
            {%- set algo_start = algo_upper + '(' -%}
            {%- set algo_end = ')' -%}

            TO_HEX(
                {{ algo_start }}
                    {%- for c in sorted_cols -%}
                        IFNULL(CAST({{ c.column }} AS STRING), 'null')
                        {%- if not loop.last -%}
                            || {%- if delimiter != '' -%} '{{ delimiter }}' || {%- endif -%}
                        {%- endif -%}
                    {%- endfor -%}
                {{ algo_end }}
            )
        {%- endif -%}
    {%- endmacro -%}

      {#===========================================================================
      Description: Builds a datatype-aware condition that's TRUE when the source and target values differ.
      Input: src_expr (string), tgt_expr (string), data_type (string)
      Output: SQL boolean condition.
      ===========================================================================#}
      {%- macro safe_compare(src_expr, tgt_expr, data_type) -%}

          {%- set dt = data_type | upper -%}

          {%- if 'GEOGRAPHY' in dt -%}
              ST_ASBINARY({{ src_expr }}) IS DISTINCT FROM ST_ASBINARY({{ tgt_expr }})
          {%- else -%}
              {{ src_expr }} IS DISTINCT FROM {{ tgt_expr }}
          {%- endif -%}

      {%- endmacro -%}

      {#===========================================================================
      Description: Builds a datatype-aware equality condition for matching business keys. GEOGRAPHY/GEOMETRY can't be compared with =, so they're compared on their WKB binary form (exact match, still an equi-join).
      Input: left_expr (string), right_expr (string), data_type (string)
      Output: SQL boolean condition. NULL never matches, same as =.
      ===========================================================================#}
      {%- macro safe_equals(left_expr, right_expr, data_type) -%}

          {%- set dt = data_type | upper -%}

          {%- if 'GEOGRAPHY' in dt -%}
              ST_ASBINARY({{ left_expr }}) = ST_ASBINARY({{ right_expr }})
          {%- else -%}
              {{ left_expr }} = {{ right_expr }}
          {%- endif -%}

      {%- endmacro -%}

    {#===========================================================================
      SECTION 3: Validation (create/run checks that stop the node)
    ===========================================================================#}

    {#===========================================================================
      fail_sql(hardFail): SELECT 1/0 (hardFail, default) or SELECT 1. CREATE does not fail a
      test stage on row count, so checks that must stop a create use the hard fail.
    ===========================================================================#}
    {%- macro fail_sql(hardFail=true) -%}
        {%- if hardFail -%}
            SELECT 1/0
        {%- else -%}
            SELECT 1
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      validate_materialization_type(allowedTypes): failing "Unsupported Materialization Type"
      check when the normalized type is not allowed. Call first in create and run.
    ===========================================================================#}
    {%- macro validate_materialization_type(allowedTypes=['table', 'view']) -%}
        {%- if nsNodeVariables.desiredMatType not in allowedTypes %}
            {{ test_stage('Unsupported Materialization Type: ' + node.name, false) }}
            -- '{{ node.materializationType | default('', true) }}' is not supported on {{ node.name }}; use one of: {{ allowedTypes | join(', ') }}
            {%- if 'transient' in nsNodeVariables.desiredMatType %}
            -- BigQuery has no transient tables; use @materializationType("table") instead.
            {%- endif %}
            {{ fail_sql() }}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      validate_column_ids(hardFail): every column needs its own @id; reports duplicate
      names and repeated ids. Used by the Dimension and Fact validators.
    ===========================================================================#}
    {%- macro validate_column_ids(hardFail=false) -%}
        {# A column without a real @id has id equal to its name. When the SELECT repeats a column name, Coalesce renames the extra copy by appending a number (SYSTEM_CREATE_DATE -> SYSTEM_CREATE_DATE1) and drops its @id, so it lands here too — report that as a duplicate name rather than a missing ID. #}
        {%- set idCheck = namespace(missing=[], duplicates=[]) -%}
        {%- for col in columns if col.id == col.name -%}
            {%- set dup = namespace(of=none) -%}
            {%- for other in columns if other.name != col.name and col.name[:other.name | length] == other.name -%}
                {%- set suffix = col.name[other.name | length:] -%}
                {%- if (suffix | int(0)) > 0 and (suffix | int) | string == suffix -%}
                    {%- set dup.of = other.name -%}
                {%- endif -%}
            {%- endfor -%}
            {%- if dup.of is not none -%}
                {%- set idCheck.duplicates = idCheck.duplicates + [{"of": dup.of, "renamed": col.name}] -%}
            {%- else -%}
                {%- set idCheck.missing = idCheck.missing + [col.name] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if idCheck.duplicates | length > 0 %}
            {%- set described = namespace(items=[]) -%}
            {%- for d in idCheck.duplicates -%}
                {%- set described.items = described.items + ["'" ~ d.of ~ "' (extra copy renamed to " ~ d.renamed ~ ")"] -%}
            {%- endfor -%}
            {# A deliberate alias like REGIONKEY1 without an @id is indistinguishable from a renamed copy, so the message covers both. #}
            {%- set renamed = idCheck.duplicates | map(attribute='renamed') | list -%}
            {%- if renamed | length > 1 -%}
                {%- set aliasHint = "If " ~ (renamed | join(', ')) ~ ' are deliberate aliases rather than copies, add a unique @id("<6 hex digits>") to each of them instead.' -%}
            {%- else -%}
                {%- set aliasHint = "If " ~ renamed[0] ~ ' is a deliberate alias rather than a copy, add a unique @id("<6 hex digits>") to it instead.' -%}
            {%- endif -%}
            {%- set reason = "Duplicate column name: " ~ (described.items | join(', ')) ~ ". The SELECT returns more than one column with the same name — remove the extra column or give it a different alias. " ~ aliasHint %}
            {{ test_stage("Duplicate Column Names", false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {# Two columns given the same @id value (exact string match). #}
        {%- set idDup = namespace(items=[]) -%}
        {%- for col in columns if col.id != col.name -%}
            {%- set sharing = columns | selectattr("id", "equalto", col.id) | map(attribute="name") | list -%}
            {%- set entry = "@id(\"" ~ col.id ~ "\") on " ~ (sharing | join(', ')) -%}
            {%- if sharing | length > 1 and entry not in idDup.items -%}
                {%- set idDup.items = idDup.items + [entry] -%}
            {%- endif -%}
        {%- endfor -%}
        {%- if idDup.items | length > 0 %}
            {%- set reason = "Duplicate column ID: " ~ (idDup.items | join('; ')) ~ '. Each column needs its own unique @id("<6 hex digits>") — change the repeated ID on all but one of them.' %}
            {{ test_stage("Duplicate Column IDs", false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {%- if idCheck.missing | length > 0 %}
            {%- set reason = "These columns have no real system-generated ID (id equals the column name): " ~ (idCheck.missing | join(', ')) ~ '. Add a unique @id("<6 hex digits>") annotation to each of them.' %}
            {{ test_stage("Missing Column IDs", false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      validate_dimension_requirements(hardFail): Dimension checks (column ids, business key,
      mergeStrategy, system columns). hardFail = true from create.
    ===========================================================================#}
      {%- macro validate_dimension_requirements(hardFail=false) -%}

          {# Every Dimension column must carry its own @id annotation. #}
          {{ validate_column_ids(hardFail) }}

          {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) -%}
          {%- if not hasBusinessKey %}
              {%- set reason = "Mark at least one column with @isBusinessKey to identify the dimension's natural/business key for SCD matching." %}
              {{ test_stage("Missing Business Key", false) }}
              -- {{ reason }}
              {{ fail_sql(hardFail) }}
          {%- endif -%}

          {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length -%}
          {%- set changeTrackingCount = columns | selectattr("isChangeTracking") | list | length -%}

          {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 -%}
          {%- if mergeStrategyExplicit -%}
              {# Matched case-insensitively (must match run.sql.j2). #}
              {%- set mergeStrategyRaw = config.mergeStrategy.parameters[0] | string | trim -%}
              {%- set mergeStrategy = mergeStrategyRaw | lower -%}
          {%- else -%}
              {# No @mergeStrategy given — always default to changeTracking, regardless of which tracking columns are present. #}
              {%- set mergeStrategy = 'changetracking' -%}
          {%- endif -%}
          {%- set isSimpleUpsert = mergeStrategy == 'upsert' -%}
          {%- set isLastModifiedStrategy = mergeStrategy == 'lastmodified' -%}
          {%- set isChangeTrackingStrategy = mergeStrategy == 'changetracking' %}

          {# An unrecognised strategy would otherwise fall through to change tracking without any warning. #}
          {%- if not (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy) %}
              {%- set reason = '@mergeStrategy(`' ~ mergeStrategyRaw ~ '`) is not a recognised strategy. Use "changeTracking", "lastModified" or "upsert".' %}
              {{ test_stage('Invalid configuration: mergeStrategy', false) }}
              -- {{ reason }}
              {{ fail_sql(hardFail) }}
          {%- endif -%}

          {# These cross-checks only apply when @mergeStrategy is set explicitly, since an inferred strategy can not conflict with itself. #}
          {%- if mergeStrategyExplicit and isSimpleUpsert and (lastModifiedCount > 0 or changeTrackingCount > 0) %}
              {{ test_stage('Invalid configuration: mergeStrategy', true) }}
              -- @mergeStrategy("upsert") performs no change detection, so @isChangeTracking/@lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "changeTracking"/"lastModified" to use them.
              SELECT 1
          {%- endif -%}

          {%- if isChangeTrackingStrategy and lastModifiedCount > 0 %}
              {{ test_stage('Invalid configuration: mergeStrategy', true) }}
              -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
              SELECT 1
          {%- endif -%}

          {%- if isLastModifiedStrategy and lastModifiedCount == 0 %}
              {%- set reason = '@mergeStrategy(`lastModified`) requires exactly one column marked @lastModifiedTracking(<scdType>); none was found.' %}
              {{ test_stage('Invalid configuration: mergeStrategy', false) }}
              -- {{ reason }}
              {{ fail_sql(hardFail) }}
          {%- endif %}

          {# Only check "at most one @lastModifiedTracking column" once lastModified is the strategy in effect. #}
          {%- if isLastModifiedStrategy and lastModifiedCount > 1 %}
              {%- set reason = "@lastModifiedTracking may be applied to at most one column, but " ~ lastModifiedCount ~ " columns were marked. Remove the annotation from all but one column." %}
              {{ test_stage('Invalid configuration: Last Modified Column', false) }}
              -- {{ reason }}
              {{ fail_sql(hardFail) }}
          {%- endif -%}

          {%- if isLastModifiedStrategy and changeTrackingCount > 0 %}
              {{ test_stage('Invalid configuration: mergeStrategy', true) }}
              -- @mergeStrategy("lastModified") does not use @isChangeTracking — those columns would be silently ignored (the last-modified comparison takes priority). Remove them, or switch mergeStrategy to "changeTracking" to use them.
              SELECT 1
          {%- endif -%}

          {%- set lastModifiedComparison = isLastModifiedStrategy and lastModifiedCount > 0 -%}
          {%- if hasBusinessKey -%}
              {%- if lastModifiedComparison %}
                  {# More than one @lastModifiedTracking column is already flagged above — treat it as inconclusive (plain SCD1) until that is fixed. #}
                  {%- if lastModifiedCount == 1 -%}
                      {%- set lastModifiedCol = columns | selectattr("lastModifiedTracking") | first %}
                      {# A bare @lastModifiedTracking (no scdType) comes through as `true`, not a mapping — guard for that and default scdType to 1. #}
                      {%- set lastModifiedTrackingParams = lastModifiedCol.lastModifiedTracking.parameters if (lastModifiedCol.lastModifiedTracking is mapping and lastModifiedCol.lastModifiedTracking.parameters is defined) else [] -%}
                      {%- set scdType = lastModifiedTrackingParams[0] | default(1, true) | string -%}
                      {%- if scdType not in ('1', '2') %}
                          {%- set reason = '@lastModifiedTracking\'s scdType parameter only accepts 1 or 2, but `' ~ scdType ~ '` was given on column ' ~ lastModifiedCol.name ~ '. Mention @lastModifiedTracking(scdType) explicitly — @lastModifiedTracking(1) to overwrite in place, or @lastModifiedTracking(2) to version the row.' %}
                          {{ test_stage('Invalid configuration: lastModifiedTracking scdType', false) }}
                          -- {{ reason }}
                          {{ fail_sql(hardFail) }}
                      {%- endif -%}
                      {%- set type2Dimension = scdType == '2' -%}
                  {%- else -%}
                      {%- set type2Dimension = false -%}
                  {%- endif -%}
              {%- else -%}
                  {%- set type2Dimension = changeTrackingCount > 0 -%}
              {%- endif -%}
          {%- else -%}
              {%- set type2Dimension = false -%}
          {%- endif -%}
          {%- if isSimpleUpsert %}
              {# @upsert always forces plain SCD1, no matter what @lastModifiedTracking/@isChangeTracking say. #}
              {%- set type2Dimension = false -%}
          {%- endif %}

          {# Collect every missing/misconfigured system column here so one run reports them all together instead of one at a time. #}
          {%- set missingSystemColumns = namespace(items=[]) %}

          {# @isSurrogateKey is normally optional (a customer may manage their own, e.g. SEQ.NEXTVAL) — required when @zeroKey needs one to match against, recommended for SCD Type 2. #}
          {%- set hasSurrogateKey = columns | selectattr("isSurrogateKey") | list | length > 0 -%}
          {%- if config.zeroKey is defined and not hasSurrogateKey -%}
              {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                  'required': true,
                  'annotation': '@isSurrogateKey',
                  'example': none,
                  'reason': '@zeroKey requires a surrogate key column to match the zero record against; none was found on this node.'
              }] -%}
          {%- elif type2Dimension and not hasSurrogateKey -%}
              {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                  'required': false,
                  'annotation': '@isSurrogateKey',
                  'example': 'CAST("0" AS STRING) AS `' ~ node.name ~ '_KEY` @id("<6 hex digits>") @isSurrogateKey @defaultValue("GENERATE_UUID()")',
                  'reason': 'Recommended for SCD Type 2, to give tables a stable per-version join key. Ignore this warning if you are managing your own surrogate key logic (e.g. a sequence NEXTVAL) instead of using @isSurrogateKey.'
              }] -%}
          {%- endif -%}

          {# The surrogate key is never written by the load (it is left out of every MERGE/INSERT column list), so BigQuery fills it from the column DEFAULT:
             a missing @defaultValue fails (new rows would get a NULL key); a default other than GENERATE_UUID() only warns, since a BigQuery default
             can not reference other columns and a constant gives every row the same key. #}
          {%- set sk = namespace(missing=[], other=[]) -%}
          {%- for col in columns if col.isSurrogateKey -%}
              {%- set skDefault = col.defaultValue | default('', true) | string | trim -%}
              {%- if skDefault | length == 0 -%}
                  {%- set sk.missing = sk.missing + [col.name] -%}
              {%- elif skDefault | upper | replace(' ', '') != 'GENERATE_UUID()' -%}
                  {%- set sk.other = sk.other + [col.name ~ ' (DEFAULT ' ~ skDefault ~ ')'] -%}
              {%- endif -%}
          {%- endfor -%}
          {%- if sk.missing | length > 0 %}
              {{ test_stage('Invalid configuration: Surrogate Key', false) }}
              -- @isSurrogateKey column {{ sk.missing | join(', ') }} has no @defaultValue.
              -- The load never writes the surrogate key, so BigQuery fills it from the column DEFAULT; without one every new row would get a NULL key, so the node stops here.
              -- Example: CAST("0" AS STRING) AS `{{ node.name }}_KEY` @id("<6 hex digits>") @isSurrogateKey @defaultValue("GENERATE_UUID()")
              {{ fail_sql(hardFail) }}
          {%- endif -%}
          {%- if sk.other | length > 0 %}
              {{ test_stage('Warning: Surrogate Key Default', true) }}
              -- @isSurrogateKey column {{ sk.other | join(', ') }} is filled from that DEFAULT on every insert.
              -- A constant default gives every row the same key.
              -- A BigQuery default can not reference other columns, so a hash of the business key fails at create.
              -- Use @defaultValue("GENERATE_UUID()") for a unique key per row.
              SELECT 1
          {%- endif -%}

          {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 -%}
          {%- if not isSimpleUpsert and not hasSystemCreateDate -%}
              {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                  'required': true,
                  'annotation': '@isSystemCreateDate',
                  'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_CREATE_DATE` @isSystemCreateDate',
                  'reason': 'Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row into CHANGE_DETECTION so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.'
              }] -%}
          {%- endif %}

          {# SYSTEM_UPDATE_DATE is required for both SCD Type 1 and Type 2. #}
          {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 -%}
          {%- if not isSimpleUpsert and not hasSystemUpdateDate -%}
              {%- if type2Dimension -%}
                  {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                      'required': true,
                      'annotation': '@isSystemUpdateDate',
                      'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_UPDATE_DATE` @isSystemUpdateDate',
                      'reason': 'Required because this is an SCD Type 2 dimension: SYSTEM_UPDATE_DATE is carried through from the current target row into CHANGE_DETECTION/MERGE_ROWS so it can be stamped with CURRENT_TIMESTAMP whenever a new or changed version is inserted, marking when that version became active.'
                  }] -%}
              {%- else -%}
                  {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                      'required': true,
                      'annotation': '@isSystemUpdateDate',
                      'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_UPDATE_DATE` @isSystemUpdateDate',
                      'reason': 'Required for SCD Type 1: without it there\'s no way to tell when a row\'s attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again.'
                  }] -%}
              {%- endif -%}
          {%- endif -%}

          {# The remaining system columns are only required for SCD Type 2. #}
          {%- if type2Dimension -%}
              {%- set hasSystemVersion = columns | selectattr("isSystemVersion") | list | length > 0 -%}
              {%- if not hasSystemVersion -%}
                  {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                      'required': true,
                      'annotation': '@isSystemVersion',
                      'example': '1 AS `SYSTEM_VERSION` @isSystemVersion',
                      'reason': 'Required because this is an SCD Type 2 dimension (a versioned last-modified column, or an @isChangeTracking column, was found): SYSTEM_VERSION is what distinguishes successive versions of the same business key, and it\'s what the outer MERGE\'s ON clause uses (alongside the business key) to target the exact row version being expired or matched.'
                  }] -%}
              {%- endif -%}

              {%- set hasSystemCurrentFlag = columns | selectattr("isSystemCurrentFlag") | list | length > 0 -%}
              {%- if not hasSystemCurrentFlag -%}
                  {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                      'required': true,
                      'annotation': '@isSystemCurrentFlag',
                      'example': 'CAST(\'Y\' AS STRING) AS `SYSTEM_CURRENT_FLAG` @isSystemCurrentFlag',
                      'reason': 'Required because this is an SCD Type 2 dimension: the CHANGE_DETECTION CTE filters TARGET_CURRENT down to WHERE SYSTEM_CURRENT_FLAG = \'Y\' to find the one active row per business key to compare the incoming source row against — without it there\'s no way to tell which of possibly several historical versions is the current one.'
                  }] -%}
              {%- endif -%}

              {%- set hasSystemEndDate = columns | selectattr("isSystemEndDate") | list | length > 0 -%}
              {%- if not hasSystemEndDate -%}
                  {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                      'required': true,
                      'annotation': '@isSystemEndDate',
                      'example': 'CAST(\'2999-12-31 00:00:00\' AS TIMESTAMP) AS `SYSTEM_END_DATE` @isSystemEndDate',
                      'reason': 'Required because this is an SCD Type 2 dimension: SYSTEM_END_DATE is what gets set to the expiry timestamp when a changed row\'s prior version is expired, and to the far-future sentinel on every newly inserted current version — without it there\'s no way to bound how long each historical version was active.'
                  }] -%}
              {%- endif -%}
          {%- endif -%}

          {%- if missingSystemColumns.items | length > 0 -%}
              {%- set anyRequired = missingSystemColumns.items | selectattr('required') | list | length > 0 %}
              {# If @isSurrogateKey is the only thing flagged, use a neutral heading since it may just be a custom surrogate key setup. #}
              {%- set onlySurrogateKeyFlagged = missingSystemColumns.items | length == 1 and missingSystemColumns.items[0].annotation == '@isSurrogateKey' and not missingSystemColumns.items[0].required -%}
              {%- set stageName = 'Surrogate Key Not Set/Using Custom Surrogate Key Logic' if onlySurrogateKeyFlagged else 'Missing Required System Columns' %}
              {{ test_stage(stageName, not anyRequired) }}
              {%- for item in missingSystemColumns.items %}
              -- {{ loop.index }}. [{{ 'REQUIRED' if item.required else 'RECOMMENDED' }}] {{ item.annotation }}
              {%- if item.example %}
              --    Example: {{ item.example }}
              {%- endif %}
              --    Reason: {{ item.reason }}
              {%- endfor %}
              {# Only hard-fail if a REQUIRED item is present; recommendations-only stays non-blocking. #}
              {%- if hardFail and anyRequired -%}
                  {{ fail_sql(hardFail) }}
              {%- else -%}
                  SELECT 1
              {%- endif -%}
          {%- endif -%}
        {# Zero key record: a value longer than its STRING(n) / BYTES(n) column's declared length is rejected by BigQuery — including the surrogate key column,
           which gets surrogateKeyValue as a string when it is a STRING/BYTES key. Plain STRING / BYTES have no length limit. Warn only. #}
        {%- if config.zeroKey is defined and hasSurrogateKey -%}
            {%- set zk = namespace(tooLong=[]) -%}
            {%- for col in columns if not (col.isSystemCurrentFlag or col.isSystemEndDate
                                           or col.isSystemUpdateDate or col.isSystemCreateDate or col.isSystemVersion) -%}
                {%- set dt = col.dataType | upper | replace(' ', '') -%}
                {%- if dt[:7] == 'STRING(' or dt[:6] == 'BYTES(' -%}
                    {%- set maxLen = dt.split('(')[1].split(')')[0] | int -%}
                    {# The exact value the Zero Key Record stage writes for this column. #}
                    {%- set zkValue = resolve_zero_key(col) | trim -%}
                    {# Only a literal can be measured: unwrap CAST(<literal> AS BYTES) and a b'...' prefix, then strip the quotes ('x' or "x").
                       Any other expression (e.g. a column-level @zeroKey("CONCAT(...)")) is skipped. #}
                    {%- set zkLiteral = zkValue[5:-10] | trim if (zkValue | upper)[:5] == 'CAST(' and (zkValue | upper)[-10:] == ' AS BYTES)' else zkValue -%}
                    {%- set zkLiteral = zkLiteral[1:] if (zkLiteral[:1] in ('b', 'B') and zkLiteral[1:2] in ("'", '"')) else zkLiteral -%}
                    {%- if zkLiteral | length > 1 and zkLiteral[:1] in ("'", '"') and zkLiteral[-1:] == zkLiteral[:1] -%}
                        {%- set zkText = zkLiteral[1:-1] -%}
                        {%- if zkText | length > maxLen -%}
                            {%- set zk.tooLong = zk.tooLong + [col.name ~ ' ' ~ col.dataType ~ ' gets ' ~ zkValue ~ ' (' ~ zkText | length ~ (' bytes' if dt[:6] == 'BYTES(' else ' characters') ~ ')'
                                                               ~ (' — the node-level @zeroKey surrogateKeyValue' if col.isSurrogateKey and not (col.zeroKey is defined) else '')] -%}
                        {%- endif -%}
                    {%- endif -%}
                {%- endif -%}
            {%- endfor -%}

            {%- if zk.tooLong %}
            {{ test_stage('Warning: Zero Key Value Too Long', true) }}
            {%- for item in zk.tooLong %}
            -- {{ item }}.
            {%- endfor %}
            -- BigQuery rejects a value longer than a STRING(n) / BYTES(n) column's length, so the Zero Key Record stage will fail.
            -- Set a shorter value on the column with @zeroKey("'<value>'") (or a shorter surrogateKeyValue in the node-level @zeroKey), or widen the column.
            SELECT 1 AS MESSAGE
            {%- endif %}
        {%- endif -%}
      {%- endmacro -%}

    {#===========================================================================
      validate_fact_requirements(hardFail): Fact checks (column ids, mergeStrategy, system
      columns). hardFail = true from create.
    ===========================================================================#}
    {%- macro validate_fact_requirements(hardFail=false) -%}

        {# Every Fact column must carry its own @id annotation. #}
        {{ validate_column_ids(hardFail) }}

        {# No @isBusinessKey column is valid for a Fact — it's loaded as a plain insert, so the mergeStrategy/tracking/system-column checks below don't apply. #}
        {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) -%}

        {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length -%}

        {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 -%}
        {%- if mergeStrategyExplicit -%}
            {# Matched case-insensitively (must match run.sql.j2). #}
            {%- set mergeStrategyRaw = config.mergeStrategy.parameters[0] | string | trim -%}
            {%- set mergeStrategy = mergeStrategyRaw | lower -%}
        {%- else -%}
            {# No @mergeStrategy given — always default to changeTracking, regardless of which tracking columns are present. #}
            {%- set mergeStrategy = 'changetracking' -%}
        {%- endif -%}
        {%- set isSimpleUpsert = mergeStrategy == 'upsert' -%}
        {%- set isLastModifiedStrategy = mergeStrategy == 'lastmodified' -%}
        {%- set isChangeTrackingStrategy = mergeStrategy == 'changetracking' -%}
        {%- set isAllColumnMatch = mergeStrategy == 'allcolumnmatch' %}

        {# An unrecognised strategy would otherwise fall through to change tracking without any warning. #}
        {%- if not (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy or isAllColumnMatch) %}
            {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") is not a recognised strategy. Use "changeTracking", "lastModified", "upsert" or "allColumnMatch".' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {# @mergeStrategy always takes priority. An explicit changeTracking/lastModified/upsert merges on the business key, so a missing @isBusinessKey stops the load.
           Not for allColumnMatch, which needs no @isBusinessKey — every column is the match key. An unrecognised value is already flagged above. #}
        {%- if not hasBusinessKey and mergeStrategyExplicit and (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy) %}
            {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") merges on the business key, but no column is marked @isBusinessKey. Mark the business key column(s) with @isBusinessKey, or remove @mergeStrategy to load the node as a plain insert.' %}
            {{ test_stage('Invalid configuration: No Business Key', false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {# No @mergeStrategy and no business key = plain insert, so @lastModifiedTracking is never read. Warn only — the insert still runs. #}
        {%- if not hasBusinessKey and not mergeStrategyExplicit and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: No Business Key', true) }}
            -- No @mergeStrategy and no column marked @isBusinessKey, so this node is loaded as a plain insert — @lastModifiedTracking will be ignored. Mark the business key column(s) with @isBusinessKey and set @mergeStrategy("lastModified") to use it, or remove the annotation.
            SELECT 1
        {%- endif -%}

        {# allColumnMatch matches on every non-system column, so @isBusinessKey / @lastModifiedTracking are never read. Warn only — the merge still runs. #}
        {%- if isAllColumnMatch and hasBusinessKey %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("allColumnMatch") matches on every non-system column, so @isBusinessKey is ignored — all columns are used as the business key for comparison. Remove @isBusinessKey, or switch mergeStrategy to use it.
            SELECT 1
        {%- endif -%}

        {%- if isAllColumnMatch and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("allColumnMatch") performs no change detection, so @lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "lastModified" to use them.
            SELECT 1
        {%- endif -%}

        {# These cross-checks only apply when @mergeStrategy is set explicitly, since an inferred strategy can't conflict with itself. #}
        {%- if hasBusinessKey and mergeStrategyExplicit and isSimpleUpsert and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("upsert") performs no change detection, so @lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "lastModified" to use them.
            SELECT 1
        {%- endif -%}

        {%- if hasBusinessKey and isChangeTrackingStrategy and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
            SELECT 1
        {%- endif -%}

        {%- if hasBusinessKey and isLastModifiedStrategy and lastModifiedCount == 0 %}
            {%- set reason = '@mergeStrategy("lastModified") requires exactly one column marked @lastModifiedTracking; none was found.' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif %}

        {# Only check "at most one @lastModifiedTracking column" once lastModified is the strategy in effect. #}
        {%- if hasBusinessKey and isLastModifiedStrategy and lastModifiedCount > 1 %}
            {%- set reason = "@lastModifiedTracking may be applied to at most one column, but " ~ lastModifiedCount ~ " columns were marked. Remove the annotation from all but one column." %}
            {{ test_stage('Invalid configuration: Last Modified Column', false) }}
            -- {{ reason }}
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {# Collect every missing/misconfigured system column here so one run reports them all together instead of one at a time. #}
        {%- set missingSystemColumns = namespace(items=[]) %}

        {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 -%}
        {%- if hasBusinessKey and not isSimpleUpsert and not isAllColumnMatch and not hasSystemCreateDate -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSystemCreateDate',
                'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_CREATE_DATE` @isSystemCreateDate',
                'reason': 'Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.'
            }] -%}
        {%- endif %}

        {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 -%}
        {%- if hasBusinessKey and not isSimpleUpsert and not isAllColumnMatch and not hasSystemUpdateDate -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSystemUpdateDate',
                'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_UPDATE_DATE` @isSystemUpdateDate',
                'reason': 'Required: without it there\'s no way to tell when a row\'s attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again.'
            }] -%}
        {%- endif -%}

        {%- if missingSystemColumns.items | length > 0 -%}
            {%- set anyRequired = missingSystemColumns.items | selectattr('required') | list | length > 0 %}
            {{ test_stage('Missing Required System Columns', not anyRequired) }}
            {%- for item in missingSystemColumns.items %}
            -- {{ loop.index }}. [{{ 'REQUIRED' if item.required else 'RECOMMENDED' }}] {{ item.annotation }}
            {%- if item.example %}
            --    Example: {{ item.example }}
            {%- endif %}
            --    Reason: {{ item.reason }}
            {%- endfor %}
            {# Only hard-fail if a REQUIRED item is present; recommendations-only stays non-blocking. #}
            {%- if hardFail and anyRequired -%}
                {{ fail_sql(hardFail) }}
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      SECTION 4: Tags (@tag annotations)
    ===========================================================================#}

    {####################################################################################################################################
      Macro : get_tag_full_name(bareTagName)

      Description:
        Fully qualifies a bare tag name (e.g. "cost_center") with the GCP project of this node's own
        location, since BigQuery tag keys are namespaced by project: <project-id>/<tagName>. That way
        @tag annotations only need the tag's own name. A name that already contains "/" (e.g. a key
        owned by another project, or an org-level key "123456789/env") is returned as-is.

      Output:
        cls-dev-bigquery/cost_center
    ####################################################################################################################################}
    {%- macro get_tag_full_name(bareTagName) -%}
        {%- set tagName = bareTagName | string | trim -%}
        {%- if '/' in tagName -%}
            {{- tagName -}}
        {%- else -%}
            {%- set locs = storageLocations -%}
            {%- set project = locs | selectattr('name', 'equalto', node.location.name) | map(attribute='database') | first -%}
            {{- project ~ '/' ~ tagName -}}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      find_duplicate_tag_names(tagList): tag names whose fully-qualified key is used more than once,
      comma-separated; '' when none. Used by tag_check_duplicates().
    ===========================================================================#}
    {%- macro find_duplicate_tag_names(tagList) -%}
        {%- set ns = namespace(entries=[], dupes=[]) -%}
        {%- for t in tagList | default([]) -%}
            {%- set ns.entries = ns.entries + [{"key": get_tag_full_name(t.parameters[0]), "name": t.parameters[0]}] -%}
        {%- endfor -%}
        {%- for e in ns.entries -%}
            {%- if (ns.entries | selectattr('key', 'equalto', e.key) | list | length) > 1 and e.name not in ns.dupes -%}
                {%- set ns.dupes = ns.dupes + [e.name] -%}
            {%- endif -%}
        {%- endfor -%}
        {{- ns.dupes | join(', ') -}}
    {%- endmacro -%}

    {#===========================================================================
      tag_check_duplicates(hardFail): failing "Duplicate Tags Found: <node>" check when the same tag key
      is applied more than once — a BigQuery table can hold only one value per tag key, so any
      repeat of the same fully-qualified key is a duplicate, even with different values
      (e.g. "env" and "cls-dev-bigquery/env" on a node in that project). BigQuery has no
      column-level tags, so a column @tag only warns ("Warning: Column Tags Ignored") and is not applied. Call at the start of create, before any DDL.
    ===========================================================================#}
    {%- macro tag_check_duplicates(hardFail=true) -%}
        {%- set nodeDupeTags = find_duplicate_tag_names(config.tag) | trim -%}
        {%- if nodeDupeTags | length > 0 %}
            {{ test_stage('Duplicate Tags Found: ' + node.name, false) }}
            -- {{ nodeDupeTags }} is applied multiple times on {{ node.name }}. A BigQuery table or view can carry only one value per tag key.
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {%- set taggedColumns = columns | selectattr('tag', 'defined') | selectattr('tag') | map(attribute='name') | list -%}
        {%- if taggedColumns | length > 0 %}
            {{ test_stage('Warning: Column Tags Ignored: ' + node.name, true) }}
            -- @tag is set on column(s) {{ taggedColumns | join(', ') }}. BigQuery has no column-level tags, so these tags are not applied.
            -- Move the @tag to the node to tag the whole table, or remove it (column-level access control in BigQuery uses Data Catalog policy tags instead).
            SELECT 1
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      validate_partition_cluster(hardFail): failing "Invalid configuration: partitionBy / partitionExpirationDays /
      clusterKey" checks — a BigQuery table has a single partition (node and column @partitionBy count together;
      column-level is a bare flag on DATE / TIMESTAMP / DATETIME), partition expiration needs a partition (only warns on RANGE_BUCKET),
      and at most 4 plain cluster columns. Call in the table branch of create, before any DDL.
    ===========================================================================#}
    {%- macro validate_partition_cluster(hardFail=true) -%}
        {# Node-level @partitionBy is allowsMultiple only so a repeat shows up here: one annotation arrives as a mapping, repeats as a list. #}
        {%- set part = namespace(exprs=[]) -%}
        {%- set partConfig = config.partitionBy if config.partitionBy is defined else none -%}
        {%- set partEntries = [] if partConfig is none else ([partConfig] if partConfig is mapping else partConfig | list) -%}
        {%- for entry in partEntries -%}
            {%- set partExpr = (entry.parameters[0] | default('', true) | string | trim) if (entry is mapping and entry.parameters is defined and entry.parameters | length > 0) else '' -%}
            {%- if partExpr | length > 0 -%}
                {%- set part.exprs = part.exprs + [partExpr] -%}
            {%- endif -%}
        {%- endfor -%}
        {# Column-level @partitionBy flags. #}
        {%- set partColumns = columns | selectattr('partitionBy', 'defined') | selectattr('partitionBy') | list -%}
        {%- set partitionCount = part.exprs | length + partColumns | length -%}

        {%- if partitionCount > 1 %}
            {%- set found = namespace(items=[]) -%}
            {%- for expr in part.exprs -%}
                {%- set found.items = found.items + ['node @partitionBy("' ~ expr ~ '")'] -%}
            {%- endfor -%}
            {%- for col in partColumns -%}
                {%- set found.items = found.items + ['column ' ~ col.name] -%}
            {%- endfor %}
            {{ test_stage('Invalid configuration: partitionBy', false) }}
            -- {{ partitionCount }} partitions are set on {{ node.name }}: {{ found.items | join('; ') }}. A BigQuery table has a single partition column or expression — keep one @partitionBy, on the node or on one column.
            {{ fail_sql(hardFail) }}
        {%- elif part.exprs | length == 1 -%}
            {# A comma outside parentheses means more than one column, e.g. "ORDER_DATE, SHIP_DATE" (commas inside RANGE_BUCKET(...) / DATE_TRUNC(...) are fine). #}
            {%- set scan = namespace(depth=0, topLevelComma=false) -%}
            {%- for ch in part.exprs[0] -%}
                {%- if ch == '(' -%}
                    {%- set scan.depth = scan.depth + 1 -%}
                {%- elif ch == ')' -%}
                    {%- set scan.depth = scan.depth - 1 -%}
                {%- elif ch == ',' and scan.depth == 0 -%}
                    {%- set scan.topLevelComma = true -%}
                {%- endif -%}
            {%- endfor -%}
            {%- if scan.topLevelComma %}
            {{ test_stage('Invalid configuration: partitionBy', false) }}
            -- @partitionBy("{{ part.exprs[0] }}") lists more than one column. A BigQuery table is partitioned by a single column or expression — keep one, and use @clusterKey for the others.
            {{ fail_sql(hardFail) }}
            {%- endif -%}
        {%- endif -%}

        {# Column-level @partitionBy is a bare flag — it partitions by the column it is on. Anything with parameters is an expression, which belongs on the node. #}
        {%- set colPart = namespace(withParams=[]) -%}
        {%- for col in partColumns if col.partitionBy is mapping and col.partitionBy.parameters is defined and col.partitionBy.parameters | length > 0 -%}
            {%- set colPart.withParams = colPart.withParams + [col.name ~ ' @partitionBy(' ~ (col.partitionBy.parameters | join(', ')) ~ ')'] -%}
        {%- endfor -%}
        {%- if colPart.withParams | length > 0 %}
            {{ test_stage('Invalid configuration: partitionBy', false) }}
            -- Column-level @partitionBy takes no parameters — it partitions by the column it is on: {{ colPart.withParams | join('; ') }}.
            -- Use a bare @partitionBy on a DATE / TIMESTAMP / DATETIME column, or put the expression on the node instead, e.g. @partitionBy("DATE_TRUNC(<column>, MONTH)").
            {{ fail_sql(hardFail) }}
        {%- elif partitionCount == 1 and partColumns | length == 1 and get_partition_column_expr(partColumns[0]) | trim | length == 0 %}
            {%- set partCol = partColumns[0] -%}
            {%- set partColType = (partCol.dataType | default('', true) | upper).split('(')[0] | trim %}
            {{ test_stage('Invalid configuration: partitionBy', false) }}
            {%- if partColType in ('INT64', 'INT', 'INTEGER', 'SMALLINT', 'BIGINT', 'TINYINT', 'BYTEINT') %}
            -- @partitionBy is on column {{ partCol.name }} ({{ partCol.dataType }}). An integer column can only be range-partitioned, which needs a start, end and step,
            -- so it can not be a column-level partition. Put it on the node instead: @partitionBy("RANGE_BUCKET({{ partCol.name }}, GENERATE_ARRAY(<start>, <end>, <step>))").
            {%- else %}
            -- @partitionBy is on column {{ partCol.name }} ({{ partCol.dataType }}). BigQuery can not partition a table by a {{ partColType }} column.
            -- Partition by a DATE, TIMESTAMP or DATETIME column (bare @partitionBy on the column), or by an INT64 column with the node-level
            -- @partitionBy("RANGE_BUCKET(<int64 column>, GENERATE_ARRAY(<start>, <end>, <step>))").
            {%- endif %}
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {%- if config.partitionExpirationDays is defined %}
            {%- if partitionCount == 0 %}
            {{ test_stage('Invalid configuration: partitionExpirationDays', false) }}
            -- @partitionExpirationDays is set on {{ node.name }}, but the table has no @partitionBy. partition_expiration_days only applies to a partitioned table — add @partitionBy (on the node or on a column), or remove @partitionExpirationDays.
            {{ fail_sql(hardFail) }}
            {%- elif part.exprs | length > 0 and 'RANGE_BUCKET' in (part.exprs[0] | upper) %}
            {{ test_stage('Warning: partitionExpirationDays Ignored', true) }}
            -- @partitionExpirationDays is set on {{ node.name }}, but the table is partitioned by integer range ({{ part.exprs[0] }}).
            -- partition_expiration_days only applies to time-partitioned tables, so it is not applied; the create continues.
            -- Remove @partitionExpirationDays, or partition by a date/time column to use it.
            SELECT 1
            {%- endif -%}
        {%- endif -%}

        {%- set cluster = namespace(columns=[], expressions=[]) -%}
        {%- for col in columns if col.clusterKey is defined -%}
            {%- set clusterParams = col.clusterKey.parameters if (col.clusterKey is mapping and col.clusterKey.parameters is defined) else [] -%}
            {%- set cluster.columns = cluster.columns + [col.name] -%}
            {%- if clusterParams | length > 1 and clusterParams[1] | string | trim | length > 0 -%}
                {%- set cluster.expressions = cluster.expressions + [col.name ~ ' (' ~ clusterParams[1] | string | trim ~ ')'] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if cluster.columns | length > 4 %}
            {{ test_stage('Invalid configuration: clusterKey', false) }}
            -- {{ cluster.columns | length }} columns are marked @clusterKey on {{ node.name }} ({{ cluster.columns | join(', ') }}). BigQuery clusters by at most 4 columns — remove @clusterKey from the rest.
            {{ fail_sql(hardFail) }}
        {%- endif -%}

        {%- if cluster.expressions | length > 0 %}
            {{ test_stage('Invalid configuration: clusterKey', false) }}
            -- @clusterKey has an expression on {{ cluster.expressions | join(', ') }}. BigQuery clusters by plain columns only — use @clusterKey(<position>) alone, and compute the expression as its own column in the SELECT if you need to cluster on it.
            {{ fail_sql(hardFail) }}
        {%- endif -%}
    {%- endmacro -%}

    {####################################################################################################################################
      Macro : get_tags_sql(tagList)

      Description:
        Generates the tags table option for a set of repeatable @tag(<tagName>, <tagValue>)
        annotations — pass config.tag. BigQuery takes tags inside the table's single OPTIONS(...) clause,
        so get_object_options_sql adds this entry there.

      Output:
        tags = [('cls-dev-bigquery/cost_center', 'finance'), ('cls-dev-bigquery/env', 'prod')]
        or '' (empty string) when tagList has no @tag annotations.
    ####################################################################################################################################}
    {%- macro get_tags_sql(tagList) -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for t in tagList | default([]) -%}
            {%- set ns.items = ns.items + ["('" ~ (get_tag_full_name(t.parameters[0]) | replace("'", "\\'")) ~ "', '" ~ (t.parameters[1] | string | trim | replace("'", "\\'")) ~ "')"] -%}
        {%- endfor -%}
        {%- if ns.items | length > 0 -%}
            tags = [{{ ns.items | join(', ') }}]
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      SECTION 5: Create helpers (table DDL clauses, view definition)

      Each table clause macro builds one complete clause from a node state, or returns an
      empty string when the clause does not apply, so a clause can be rendered for both
      states and compared.
    ===========================================================================#}

    {#===========================================================================
      get_partition_column_expr(col): partition expression for a column-level @partitionBy —
      `col` for DATE, DATE(`col`) for TIMESTAMP / DATETIME, '' for any other type.
    ===========================================================================#}
    {%- macro get_partition_column_expr(col) -%}
        {%- set baseType = (col.dataType | default('', true) | upper).split('(')[0] | trim -%}
        {%- if baseType == 'DATE' -%}
            `{{ col.name }}`
        {%- elif baseType in ('TIMESTAMP', 'DATETIME') -%}
            DATE(`{{ col.name }}`)
        {%- endif -%}
    {%- endmacro -%}

    {#===================================================================================================
    get_partition_by_sql(nodeConfig, nodeColumns)

    Description:
        Builds the PARTITION BY clause from the @partitionBy(column/expression) annotation — on the node,
        or on one column. The column or expression is written as-is, so it covers every BigQuery
        partition kind:
        - ingestion time   : _PARTITIONDATE, or e.g. DATE_TRUNC(_PARTITIONTIME, MONTH)  (node-level only)
        - time-unit column : a DATE column, or e.g. DATE(ts_col), TIMESTAMP_TRUNC(ts_col, HOUR)
        - integer range    : e.g. RANGE_BUCKET(int_col, GENERATE_ARRAY(0, 100, 10))
        A column-level @partitionBy (a bare flag) partitions by that column: `col` for DATE, DATE(`col`) for TIMESTAMP / DATETIME.
        The node-level annotation wins when both are set (validate_partition_cluster() flags that).

    Examples:
        @partitionBy("_PARTITIONDATE") on the node           -> PARTITION BY _PARTITIONDATE
        @partitionBy on DATE column ORDER_DATE               -> PARTITION BY `ORDER_DATE`
        @partitionBy on TIMESTAMP column LAST_MODIFIED       -> PARTITION BY DATE(`LAST_MODIFIED`)
        No annotation                                        -> empty
    ====================================================================================================#}
    {%- macro get_partition_by_sql(nodeConfig, nodeColumns=[]) -%}
        {# The node-level @partitionBy is declared allowsMultiple only so a repeated annotation reaches validate_partition_cluster (which stops the create);
           a single annotation arrives as a mapping, repeats as a list — the first entry is used. #}
        {%- set partEntry = nodeConfig.partitionBy if nodeConfig.partitionBy is defined else none -%}
        {%- if partEntry is not none and partEntry is not mapping -%}
            {%- set partEntry = partEntry | first if partEntry | length > 0 else none -%}
        {%- endif -%}
        {%- set partExpr = (partEntry.parameters[0] | default('', true) | string | trim)
                if (partEntry is mapping and partEntry.parameters is defined and partEntry.parameters | length > 0)
                else '' -%}
        {%- if partExpr | length == 0 -%}
            {%- set partColumn = nodeColumns | default([], true) | selectattr('partitionBy', 'defined') | selectattr('partitionBy') | first -%}
            {%- if partColumn is defined and partColumn -%}
                {%- set partExpr = get_partition_column_expr(partColumn) | trim -%}
            {%- endif -%}
        {%- endif -%}
        {%- if partExpr | length > 0 -%}
            PARTITION BY {{ partExpr }}
        {%- endif -%}
    {%- endmacro -%}

    {#===================================================================================================
    get_primary_key_sql(nodeColumns)

    Description:
        Builds the PRIMARY KEY table constraint from the @primaryKey(<position>) column annotation.
        Columns are ordered by <position> (lowest first); columns with the same position keep node column order.
        BigQuery primary keys are never enforced, so NOT ENFORCED is always added.

    Examples:
        @primaryKey(1) on N_NATIONKEY                        -> PRIMARY KEY (`N_NATIONKEY`) NOT ENFORCED
        @primaryKey(1) on N_REGIONKEY, @primaryKey(2) on N_NATIONKEY
                                                             -> PRIMARY KEY (`N_REGIONKEY`, `N_NATIONKEY`) NOT ENFORCED
        No column marked                                     -> empty
    ====================================================================================================#}
    {%- macro get_primary_key_sql(nodeColumns) -%}
        {%- set pk = namespace(items=[]) -%}
        {%- for col in nodeColumns -%}
            {%- if col.primaryKey is defined -%}
                {%- set pkParams = col.primaryKey.parameters if (col.primaryKey is mapping and col.primaryKey.parameters is defined) else [] -%}
                {%- set pk.items = pk.items + [{
                        "position": (pkParams[0] | int(0)) if pkParams | length > 0 else 0,
                        "column": '`' + col.name + '`'
                    }] -%}
            {%- endif -%}
        {%- endfor -%}
        {%- if pk.items | length > 0 -%}
            PRIMARY KEY ({{ pk.items | sort(attribute='position') | map(attribute='column') | join(', ') }}) NOT ENFORCED
        {%- endif -%}
    {%- endmacro -%}

    {#===================================================================================================
    get_clusterby_sql(nodeColumns)

    Description:
        Builds the CLUSTER BY clause from the @clusterKey(<position>) column annotation.
        Columns are ordered by <position> (lowest first); columns with the same position keep node column
        order. BigQuery clusters by plain top-level columns only (no expressions, at most 4 columns).

    Examples:
        @clusterKey(1) on N_REGIONKEY, @clusterKey(2) on N_NAME -> CLUSTER BY `N_REGIONKEY`, `N_NAME`
        No column marked                                        -> empty
    ====================================================================================================#}
    {%- macro get_clusterby_sql(nodeColumns) -%}
        {%- set cols = namespace(items=[]) -%}
        {%- for col in nodeColumns -%}
            {%- if col.clusterKey is defined -%}
                {%- set clusterParams = col.clusterKey.parameters if (col.clusterKey is mapping and col.clusterKey.parameters is defined) else [] -%}
                {%- set cols.items = cols.items + [{
                        "position": (clusterParams[0] | int(0)) if clusterParams | length > 0 else 0,
                        "column": '`' + col.name + '`'
                    }] -%}
            {%- endif -%}
        {%- endfor -%}
        {%- if cols.items | length > 0 -%}
            CLUSTER BY {{ cols.items | sort(attribute='position') | map(attribute='column') | join(', ') }}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      get_object_options_sql(nodeConfig, description, resetUnset, nodeColumns, forView): the single OPTIONS(...)
      clause for a table or a view; forView=true leaves out the two
      table-only options (partition_expiration_days, default_rounding_mode). Used by the create templates;
    ===========================================================================#}
    {%- macro get_object_options_sql(nodeConfig, description, resetUnset=false, nodeColumns=[], forView=false) -%}
        {%- set opts = namespace(items=[]) -%}

        {# partition_expiration_days only applies to time-partitioned tables, i.e. any partition but an integer-range RANGE_BUCKET one #}
        {%- set partitionSql = get_partition_by_sql(nodeConfig, nodeColumns) | trim -%}
        {%- set isTimePartitioned = not forView and partitionSql | length > 0 and 'RANGE_BUCKET' not in (partitionSql | upper) -%}
        {%- if isTimePartitioned -%}
            {%- if nodeConfig.partitionExpirationDays is defined and nodeConfig.partitionExpirationDays.parameters is defined and nodeConfig.partitionExpirationDays.parameters | length > 0 -%}
                {%- set opts.items = opts.items + ['partition_expiration_days = ' ~ nodeConfig.partitionExpirationDays.parameters[0]] -%}
            {%- elif resetUnset -%}
                {%- set opts.items = opts.items + ['partition_expiration_days = NULL'] -%}
            {%- endif -%}
        {%- endif -%}

        {%- set expiration = get_expiration_timestamp_sql(nodeConfig) | trim -%}
        {%- if expiration | length > 0 -%}
            {%- set opts.items = opts.items + ['expiration_timestamp = ' ~ expiration] -%}
        {%- elif resetUnset -%}
            {%- set opts.items = opts.items + ['expiration_timestamp = NULL'] -%}
        {%- endif -%}

        {# default_rounding_mode is a table option only #}
        {%- set hasRoundingMode = not forView and nodeConfig.defaultRoundingMode is defined and nodeConfig.defaultRoundingMode.parameters is defined and nodeConfig.defaultRoundingMode.parameters | length > 0 -%}
        {%- set roundingMode = (nodeConfig.defaultRoundingMode.parameters[0] | default('', true) | string | trim) if hasRoundingMode else '' -%}
        {%- if roundingMode | length > 0 -%}
            {%- set opts.items = opts.items + ["default_rounding_mode = '" ~ roundingMode ~ "'"] -%}
        {%- elif resetUnset and not forView -%}
            {%- set opts.items = opts.items + ['default_rounding_mode = NULL'] -%}
        {%- endif -%}

        {%- set tagsOption = get_tags_sql(nodeConfig.tag) | trim -%}
        {%- if tagsOption | length > 0 -%}
            {%- set opts.items = opts.items + [tagsOption] -%}
        {%- elif resetUnset -%}
            {%- set opts.items = opts.items + ['tags = []'] -%}
        {%- endif -%}

        {%- if description | default('', true) | trim | length > 0 -%}
            {%- set opts.items = opts.items + ["description = '" ~ (description | escape) ~ "'"] -%}
        {%- elif resetUnset -%}
            {%- set opts.items = opts.items + ['description = NULL'] -%}
        {%- endif -%}

        {%- if opts.items | length > 0 -%}
            OPTIONS({{ opts.items | join(', ') }})
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      get_expiration_timestamp_sql(nodeConfig): the expiration_timestamp value from @tableExpiration —
      a whole number is a day count (TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL <n> DAY)), anything else a
      date / datetime (a date alone expires at 23:59:59); '' when not set.
    ===========================================================================#}
    {%- macro get_expiration_timestamp_sql(nodeConfig) -%}
        {%- if nodeConfig.tableExpiration is defined and nodeConfig.tableExpiration.parameters is defined and nodeConfig.tableExpiration.parameters | length > 0 -%}
            {%- set exprnValue = nodeConfig.tableExpiration.parameters[0] | default('', true) | string | trim -%}
            {%- if exprnValue | length > 0 -%}
                {%- if (exprnValue | int(-1)) >= 0 and (exprnValue | int(-1)) | string == exprnValue -%}
                    TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL {{ exprnValue }} DAY)
                {%- else -%}
                    TIMESTAMP "{{ exprnValue }}{{ '"' if exprnValue | length > 11 else ' 23:59:59"' }}
                {%- endif -%}
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      view_options_alter_sql(currentState, desiredState): OPTIONS(...) with only the view options that changed
      between the two states — expiration_timestamp, tags, description; a removed one is reset (NULL, tags = []).
      '' when none changed. Options left out keep their value, so a tag change does not restart a relative
      expiration. Used by the view branch of the create templates for ALTER VIEW ... SET.
    ===========================================================================#}
    {%- macro view_options_alter_sql(currentState, desiredState) -%}
        {%- set ns = namespace(items=[]) -%}

        {%- set currentExpiration = get_expiration_timestamp_sql(currentState.config) | trim -%}
        {%- set desiredExpiration = get_expiration_timestamp_sql(desiredState.config) | trim -%}
        {%- if currentExpiration != desiredExpiration -%}
            {%- set ns.items = ns.items + ['expiration_timestamp = ' ~ (desiredExpiration if desiredExpiration | length > 0 else 'NULL')] -%}
        {%- endif -%}

        {%- set currentTags = get_tags_sql(currentState.config.tag) | trim -%}
        {%- set desiredTags = get_tags_sql(desiredState.config.tag) | trim -%}
        {%- if currentTags != desiredTags -%}
            {%- set ns.items = ns.items + [desiredTags if desiredTags | length > 0 else 'tags = []'] -%}
        {%- endif -%}

        {%- set currentDescription = currentState.node.description | default('', true) | trim -%}
        {%- set desiredDescription = desiredState.node.description | default('', true) | trim -%}
        {%- if currentDescription != desiredDescription -%}
            {%- set ns.items = ns.items + [("description = '" ~ (desiredState.node.description | escape) ~ "'") if desiredDescription | length > 0 else 'description = NULL'] -%}
        {%- endif -%}

        {%- if ns.items | length > 0 -%}
            OPTIONS({{ ns.items | join(', ') }})
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      view_definition_sql(state, withOptions): view column list, descriptions, OPTIONS and AS SELECT for a state.
      withOptions=false leaves the view OPTIONS (description, tags, expiration) out, so a redeploy can tell a
      definition change (CREATE OR REPLACE VIEW) from an options-only change (ALTER VIEW SET OPTIONS).
      Surrogate key and system columns (Dimension/Fact) select CAST(NULL AS <type>).
    ===========================================================================#}
    {%- macro view_definition_sql(state, withOptions=true) -%}
        (
            {%- for col in state.columns %}
                `{{ col.name }}`
                {%- if col.description | trim | length > 0 %} OPTIONS(description = '{{ col.description | trim | escape }}') {%- endif %}
                {%- if not loop.last -%}, {%- endif %}
            {%- endfor %}
        )
        {%- if withOptions %}
        {{ get_object_options_sql(state.config, state.node.description, false, state.columns, true) }}
        {%- endif %}
        AS
        {{ state.sources[0].cteString }}
        SELECT {{ state.sources[0].selectModifier | default('', true) }}
        {%- for col in state.sources[0].columns %}
            {%- if col.isSurrogateKey or col.isSystemVersion or col.isSystemCurrentFlag
                    or col.isSystemCreateDate or col.isSystemUpdateDate or col.isSystemEndDate %}
                CAST(NULL AS {{ col.dataType }})
            {%- else %}
                {{ get_source_transform(col) }}
            {%- endif %}
            AS `{{ col.name }}`
            {%- if not loop.last -%}, {%- endif %}
        {%- endfor %}
        {{ state.sources[0].join }}
    {%- endmacro -%}

    {#===========================================================================
      SECTION 6: Redeploy (advanced deploy: drop, alter on a clone, metadata)

      A table is recreated (drop + create) when what BigQuery cannot alter changes: the
      materialization type, the dataset, the partitioning or the clustering. Any other change
      is applied to a clone: Clone Table -> alters -> Replace Table (the clone is copied back over
      the table) -> Delete Clone -> Edit Table Options (COPY drops the table expiration).
      Views are recreated when their definition changes.
    ===========================================================================#}

    {#===========================================================================
      object_drop_sql(): "Drop Current <type> - <name>" when the node is deleted, the type
      changed or a view moved/renamed. A deleted table also drops its leftover clone ("Delete Clone").
    ===========================================================================#}
    {%- macro object_drop_sql() -%}
        {%- if currentState is defined and currentState -%}
            {%- set currentMatType = nsNodeVariables.currentMatType -%}
            {%- set nodeDeleted = desiredState is not defined or not desiredState -%}
            {%- set dropCurrent = nodeDeleted
                                  or currentMatType != nsNodeVariables.desiredMatType
                                  or (nsNodeVariables.desiredMatType == 'view'
                                      and nsNodeVariables.curObjectNameFullPath != nsNodeVariables.desObjectNameFullPath) -%}

            {%- if nodeDeleted and currentMatType != 'view' %}
                {{ stage('Delete Clone') }}
                DROP TABLE IF EXISTS {{ nsNodeVariables.cloneObjectNameFullPath }}
            {%- endif %}

            {%- if dropCurrent %}
                {{ stage('Drop Current ' + currentMatType + ' - ' + currentState.node.name, true, "sql", "drop") }}
                DROP {{ drop_materialization(currentMatType) }} {{ nsNodeVariables.curObjectNameFullPath }}
                {%- set nsNodeVariables.metaDataChanged = true -%}
            {%- endif %}
        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      alter_column_warnings_sql(): non-failing "Warning: NOT NULL Not Applied" when a column
      becomes NOT NULL, or a NOT NULL column is added — BigQuery cannot SET NOT NULL or add a
      REQUIRED column to an existing table. The column stays NULLABLE until the table is
      recreated. Call outside the alter block, so a warning alone does not clone the table.
    ===========================================================================#}
    {%- macro alter_column_warnings_sql() -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for desCol in columns if desCol.nullable == false -%}
            {%- set curMatch = currentState.columns | default([]) | selectattr('id', 'equalto', desCol.id) | list -%}
            {%- if not curMatch -%}
                {%- set ns.items = ns.items + [desCol.name ~ ' (new column)'] -%}
            {%- elif (curMatch | first).nullable != false -%}
                {%- set ns.items = ns.items + [desCol.name] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if ns.items %}
            {{ test_stage('Warning: NOT NULL Not Applied', true) }}
            -- NOT NULL is not applied to: {{ ns.items | join(', ') }}.
            -- BigQuery cannot make an existing column NOT NULL or add a NOT NULL column to an existing table, so these columns stay NULLABLE.
            -- Drop and recreate the table to apply NOT NULL.
            SELECT 1 AS MESSAGE
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      alter_modify_columns_sql(): data type, nullability, description and default changes,
      using the old column names. BigQuery cannot mix SET DATA TYPE with the other
      ALTER COLUMN actions in one statement, so "Alter Column Data Type" runs first and
      "Alter Column" holds DROP NOT NULL / SET or DROP DEFAULT / SET OPTIONS(description).
      Call before alter_rename_columns_sql().
    ===========================================================================#}
    {%- macro alter_modify_columns_sql() -%}
        {%- set ns = namespace(typeActions=[], actions=[]) -%}
        {%- for curCol in currentState.columns -%}
            {%- set matchingCols = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}

            {%- if matchingCols -%}
                {%- set desCol = matchingCols | first -%}
                {%- set colName = '`' ~ curCol.name ~ '`' -%}
                {%- set currentNotNull = curCol.nullable == false -%}
                {%- set currentDefaultValue = curCol.defaultValue if curCol.defaultValue else none -%}
                {%- set currentDescription = curCol.description | trim if curCol.description | trim | length > 0 else '' -%}
                {%- set desiredNotNull = desCol.nullable == false -%}
                {%- set desiredDefaultValue = desCol.defaultValue if desCol.defaultValue else none -%}
                {%- set desiredDescription = desCol.description | trim if desCol.description | trim | length > 0 else '' -%}

                {%- if (curCol.dataType | upper | replace(' ', '')) != (desCol.dataType | upper | replace(' ', '')) -%}
                    {%- set ns.typeActions = ns.typeActions + ['ALTER COLUMN ' ~ colName ~ ' SET DATA TYPE ' ~ desCol.dataType] -%}
                {%- endif -%}
                {#- Only relaxing is possible; tightening is reported by alter_column_warnings_sql() #}
                {%- if currentNotNull and not desiredNotNull -%}
                    {%- set ns.actions = ns.actions + ['ALTER COLUMN ' ~ colName ~ ' DROP NOT NULL'] -%}
                {%- endif -%}
                {%- if currentDescription != desiredDescription -%}
                    {%- set ns.actions = ns.actions + ['ALTER COLUMN ' ~ colName ~ (" SET OPTIONS(description = '" ~ (desiredDescription | escape) ~ "')" if desiredDescription else ' SET OPTIONS(description = NULL)')] -%}
                {%- endif -%}
                {%- if currentDefaultValue != desiredDefaultValue -%}
                    {%- set ns.actions = ns.actions + ['ALTER COLUMN ' ~ colName ~ (' SET DEFAULT ' ~ desiredDefaultValue if desiredDefaultValue != none else ' DROP DEFAULT')] -%}
                {%- endif -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if ns.typeActions | length > 0 %}
            {{ stage('Alter Column Data Type') }}
            ALTER TABLE {{ nsNodeVariables.alterObjectNameFullPath }}
            {{ ns.typeActions | join(', ') }}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}

        {%- if ns.actions | length > 0 %}
            {{ stage('Alter Column') }}
            ALTER TABLE {{ nsNodeVariables.alterObjectNameFullPath }}
            {{ ns.actions | join(', ') }}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      alter_add_columns_sql(): "Add Column" — one ALTER for columns with a new id, with their
      description. BigQuery cannot add a column with a DEFAULT, so for each new column with a
      default: "Set Default: <col>" then "Backfill Default: <col>" fills the existing rows.
    ===========================================================================#}
    {%- macro alter_add_columns_sql() -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for desCol in columns -%}
            {%- set idAlreadyCurrent = currentState.columns | default([]) | selectattr('id', 'equalto', desCol.id) | list -%}
            {%- if not idAlreadyCurrent -%}
                {%- set ns.items = ns.items + [desCol] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if ns.items | length > 0 %}
            {{ stage('Add Column') }}
            ALTER TABLE {{ nsNodeVariables.alterObjectNameFullPath }}
            {%- for desCol in ns.items %}
                ADD COLUMN `{{ desCol.name }}` {{ desCol.dataType }}
                {%- if desCol.description | trim | length > 0 %} OPTIONS(description = '{{ desCol.description | trim | escape }}'){%- endif %}
                {%- if not loop.last -%}, {%- endif %}
            {%- endfor %}
            {%- set nsNodeVariables.metaDataChanged = true -%}

            {%- for desCol in ns.items if desCol.defaultValue %}
                {{ stage('Set Default: ' + desCol.name) }}
                ALTER TABLE {{ nsNodeVariables.alterObjectNameFullPath }}
                ALTER COLUMN `{{ desCol.name }}` SET DEFAULT {{ desCol.defaultValue }}

                {{ stage('Backfill Default: ' + desCol.name) }}
                UPDATE {{ nsNodeVariables.alterObjectNameFullPath }}
                SET `{{ desCol.name }}` = {{ desCol.defaultValue }}
                WHERE TRUE
            {%- endfor %}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      alter_rename_columns_sql(): "Rename Column" per column whose id is kept but name
      changed. A column without @id has its name as id, so renaming it drops and re-adds it.
    ===========================================================================#}
    {%- macro alter_rename_columns_sql() -%}
        {%- for curCol in currentState.columns -%}
            {%- set idMatches = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
            {%- if idMatches and (idMatches | first).name != curCol.name %}
                {{ stage('Rename Column') }}
                ALTER TABLE {{ nsNodeVariables.alterObjectNameFullPath }}
                RENAME COLUMN `{{ curCol.name }}` TO `{{ (idMatches | first).name }}`
                {%- set nsNodeVariables.metaDataChanged = true -%}
            {%- endif %}
        {%- endfor -%}
    {%- endmacro -%}

    {#===========================================================================
      alter_drop_columns_sql(): "Delete Column" — one ALTER with a DROP COLUMN per removed column.
    ===========================================================================#}
    {%- macro alter_drop_columns_sql() -%}
        {%- if nsNodeVariables.droppedColumns | length > 0 %}
            {{ stage('Delete Column') }}
            ALTER TABLE {{ nsNodeVariables.alterObjectNameFullPath }}
            {%- for colName in nsNodeVariables.droppedColumns %}
                DROP COLUMN {{ colName }}
                {%- if not loop.last -%}, {%- endif %}
            {%- endfor %}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
        alter_table_options_sql(): "Edit Table Options" — one SET OPTIONS(...) on the table when any
        table option changed (description, table/partition expiration, rounding mode or tags), or
        when the clone replaced the table and the node has @tableExpiration or @tag:
        CREATE OR REPLACE ... COPY keeps the description, rounding mode and partition expiration,
        but drops the table expiration and the tags, so those must be re-applied. Every option is
        listed and a removed one is reset to NULL (tags to []). Call after alter_clone_swap_sql().
    ===========================================================================#}
      {%- macro alter_table_options_sql() -%}
          {%- set currentOptions = get_object_options_sql(currentState.config, currentState.node.description, false, currentState.columns) | trim -%}
          {%- set desiredOptions = get_object_options_sql(config, node.description, false, columns) | trim -%}
          {#- Options COPY does not carry over, set on this node #}
          {%- set hasTableExpiration = config.tableExpiration is defined and config.tableExpiration.parameters is defined and config.tableExpiration.parameters | length > 0 -%}
          {%- set hasTags = config.tag | default([]) | length > 0 -%}
          {%- if currentOptions != desiredOptions or (nsNodeVariables.tableReplaced and (hasTableExpiration or hasTags)) %}
              {{ stage('Edit Table Options') }}
              ALTER TABLE {{ nsNodeVariables.desObjectNameFullPath }}
              SET {{ get_object_options_sql(config, node.description, true, columns) | trim }}
              {%- set nsNodeVariables.metaDataChanged = true -%}
          {%- endif %}
      {%- endmacro -%}

    {#===========================================================================
      alter_clone_swap_sql(alterSql): wraps the alters in Clone Table -> alterSql -> Replace
      Table -> Delete Clone, the pattern the BigQuery YAML node types use: the clone is copied
      back over the table (CREATE OR REPLACE ... COPY), so the table never disappears.
      COPY keeps the primary key, so it is only dropped / re-added on the clone when the key
      itself changes (a key column renamed or dropped is a key change). When the node was
      renamed the clone is copied to the new name and the old table deleted.
      '' when there is nothing to alter, the name is unchanged and the primary key is unchanged.
    ===========================================================================#}
    {%- macro alter_clone_swap_sql(alterSql) -%}
        {%- set clonePath = nsNodeVariables.cloneObjectNameFullPath -%}
        {%- set currentPath = nsNodeVariables.curObjectNameFullPath -%}
        {%- set desiredPath = nsNodeVariables.desObjectNameFullPath -%}
        {%- set pathChanged = currentPath != desiredPath -%}
        {%- set currentPrimaryKey = get_primary_key_sql(currentState.columns) | trim -%}
        {%- set desiredPrimaryKey = get_primary_key_sql(columns) | trim -%}
        {%- set primaryKeyChanged = currentPrimaryKey != desiredPrimaryKey -%}

        {%- if alterSql | trim | length > 0 or pathChanged or primaryKeyChanged %}
            {{ stage('Clone Table') }}
            CREATE OR REPLACE TABLE {{ clonePath }}
            COPY {{ currentPath }}

            {%- if primaryKeyChanged and currentPrimaryKey | length > 0 %}
                {{ stage('Drop Primary Key') }}
                ALTER TABLE {{ clonePath }}
                DROP PRIMARY KEY
            {%- endif %}

            {{ alterSql }}

            {%- if primaryKeyChanged and desiredPrimaryKey | length > 0 %}
                {{ stage('Add Primary Key') }}
                ALTER TABLE {{ clonePath }}
                ADD {{ desiredPrimaryKey }}
            {%- endif %}

            {{ stage('Replace Table') }}
            CREATE OR REPLACE TABLE {{ desiredPath }}
            COPY {{ clonePath }}

            {%- if pathChanged %}
                {{ stage('Delete Table') }}
                DROP TABLE IF EXISTS {{ currentPath }}
            {%- endif %}

            {{ stage('Delete Clone') }}
            DROP TABLE IF EXISTS {{ clonePath }}
            {%- set nsNodeVariables.tableReplaced = true -%}
            {%- set nsNodeVariables.metaDataChanged = true -%}
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      alter_metadata_sql(): "Metadata Update-Default" (SELECT 1 = 0) when the node changed
      but no stage altered the object. Call last.
    ===========================================================================#}
    {%- macro alter_metadata_sql() -%}
        {%- if currentState != desiredState and not nsNodeVariables.metaDataChanged %}
            {{ stage('Metadata Update-Default') }}
            SELECT 1 = 0
        {%- endif %}
    {%- endmacro -%}

    {#===========================================================================
      SECTION 7: Run (data load)
    ===========================================================================#}

    {#===========================================================================
      run_tests(runOrder): node and column data quality tests for 'Before' or 'After' the load.
    ===========================================================================#}
    {%- macro run_tests(runOrder) -%}

      {%- set columnContinueOnFailure = true -%}

      {%- if get_boolean_config("disableTests") != "true" -%}
          {%- if runOrder == "After" -%}
              {%- for col in columns -%}
                  {%- set colName = '`' + col.name + '`' -%}
                  {%- set target = ref(node.location.name, node.name) -%}
                  {%- if col.not_null is defined -%}
                      {{ test_stage(col.name + ': not_null', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NULL
                  {%- endif -%}
                  {%- if col.uniqueness is defined -%}
                      {{ test_stage(col.name + ': uniqueness', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      GROUP BY {{ colName }}
                      HAVING COUNT(*) > 1
                  {%- endif -%}
                  {%- if col.empty is defined -%}
                      {{ test_stage(col.name + ': empty', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NOT NULL AND TRIM({{ colName }}) = ''
                  {%- endif -%}
                    {%- set nsAccepted = namespace(values=[]) -%}
                      {%- for v in col.accepted_values | default([]) -%}
                          {%- for p in v.parameters | default([]) -%}
                              {%- for val in (p | string).split(',') -%}
                                  {%- set nsAccepted.values = nsAccepted.values + [val.strip()] -%}
                              {%- endfor -%}
                          {%- endfor -%}
                      {%- endfor -%}
                  {%- if nsAccepted.values | length > 0 -%}
                      {{ test_stage(col.name + ': accepted_values', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NOT NULL
                          AND {{ colName }} NOT IN ({{ nsAccepted.values | join(', ') }})
                  {%- endif -%}
                      {%- set nsRejected = namespace(values=[]) -%}
                      {%- for v in col.rejected_values | default([]) -%}
                          {%- for p in v.parameters | default([]) -%}
                              {%- for val in (p | string).split(',') -%}
                                  {%- set nsRejected.values = nsRejected.values + [val.strip()] -%}
                              {%- endfor -%}
                          {%- endfor -%}
                      {%- endfor -%}
                  {%- if nsRejected.values | length > 0 -%}
                      {{ test_stage(col.name + ': rejected_values', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IN ({{ nsRejected.values | join(', ') }})
                  {%- endif -%}
                  {%- if col.min_max is defined and col.min_max.parameters is defined -%}
                      {{ test_stage(col.name + ': min_max', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NOT NULL
                      AND ({{ colName }} < {{ col.min_max.parameters[0] }} OR {{ colName }} > {{ col.min_max.parameters[1] }})
                  {%- endif -%}
                  {%- if col.min_value is defined and col.min_value.parameters is defined -%}
                      {{ test_stage(col.name + ': min_value', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NOT NULL AND {{ colName }} < {{ col.min_value.parameters[0] }}
                  {%- endif -%}
                  {%- if col.max_value is defined and col.max_value.parameters is defined -%}
                      {{ test_stage(col.name + ': max_value', columnContinueOnFailure) }}
                      SELECT {{ colName }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NOT NULL AND {{ colName }} > {{ col.max_value.parameters[0] }}
                  {%- endif -%}
                  {%- if col.freshness is defined and col.freshness.parameters is defined -%}
                      {{ test_stage(col.name + ': freshness', columnContinueOnFailure) }}
                      SELECT MAX(CAST({{ colName }} AS DATETIME)) AS `LATEST_VALUE`
                      FROM {{ target }}
                      HAVING MAX(CAST({{ colName }} AS DATETIME)) IS NULL
                          OR MAX(CAST({{ colName }} AS DATETIME)) < DATETIME_SUB(CURRENT_DATETIME(), INTERVAL {{ col.freshness.parameters[0] }} {{ col.freshness.parameters[1] | default('DAY', true) }})
                  {%- endif -%}
                  {%- if col.relative_time is defined and col.relative_time.parameters is defined -%}
                      {%- set other = '`' + col.relative_time.parameters[1] + '`' -%}
                      {{ test_stage(col.name + ': relative_time', columnContinueOnFailure) }}
                      SELECT {{ colName }}, {{ other }}
                      FROM {{ target }}
                      WHERE {{ colName }} IS NOT NULL AND {{ other }} IS NOT NULL
                      AND NOT ({{ colName }} {{ col.relative_time.parameters[0] }} {{ other }})
                  {%- endif -%}
              {%- endfor -%}
          {%- endif -%}

            {%- set ns = namespace(cnt=0) -%}
            {%- for test in config.tests | default([]) -%}
                {%- if test is mapping and test.parameters is defined -%}
                    {%- if test.parameters[2] | default("After") == runOrder -%}
                        {%- set ns.cnt = ns.cnt + 1 -%}
                        {{ test_stage(
                            ('Pre Load Test ' if runOrder == 'Before' else 'Post Load Test ') ~ ns.cnt,
                            test.parameters[1] | default(true)
                        ) }}
                        {{ test.parameters[0] }}
                    {%- endif -%}
                {%- endif -%}
            {%- endfor -%}

        {%- endif -%}
    {%- endmacro -%}

    {#===========================================================================
      run_pre_post_sql(runOrder): 'Pre' / 'Post' -> one "Pre-SQL <n>" / "Post-SQL <n>" stage
      per @preSQL / @postSQL statement.
    ===========================================================================#}
    {%- macro run_pre_post_sql(runOrder) -%}
        {%- set sqlList = config.preSQL if runOrder == 'Pre' else config.postSQL -%}
        {%- set ns = namespace(cnt=0) %}
        {%- for sql in sqlList | default([], true) %}
            {%- if sql is mapping and sql.parameters is defined %}
                {%- set ns.cnt = ns.cnt + 1 %}
                {{ stage(runOrder ~ '-SQL ' ~ ns.cnt) }}
                {{ sql.parameters[0] }}
            {%- endif %}
        {%- endfor %}
    {%- endmacro -%}

      {#===========================================================================
          Description: Resolves the zero-key literal for a column (column-level @zeroKey wins, else node-level @zeroKey by dataType, else NULL).
          Input: col (object)
          Output: SQL literal for the resolved zero-key value.
      ===========================================================================#}
      {%- macro resolve_zero_key(col) -%}

          {%- set ns = namespace(zk_type=none, zk_value=none) -%}

          {# Column-level zeroKey #}
          {%- if col.zeroKey is defined
              and col.zeroKey.parameters is defined
              and col.zeroKey.parameters | trim | length > 0 -%}

              {%- set ns.zk_value = col.zeroKey.parameters[0] -%}

          {# Node-level zeroKey, matched by column dataType #}
          {%- else -%}
              {%- set zkParams = config.zeroKey.parameters if (config.zeroKey is defined and config.zeroKey.parameters is defined) else [] -%}
              {%- if col.dataType | upper in ('JSON', 'VARIANT') -%}
                  {%- set ns.zk_type = 'variant' -%}
                  {%- set ns.zk_value = none -%}
              {%- elif col.dataType[:3] | upper in ('VAR', 'CHA', 'STR', 'TEX') -%}
                  {%- set ns.zk_type = 'string' -%}
                  {%- set ns.zk_value = zkParams[1] if zkParams | length > 1 else "'UNKNOWN'" -%}
              {# Every numeric type (NUMBER/NUMERIC/DECIMAL, INT/INTEGER/BIGINT/SMALLINT/TINYINT/BYTEINT, FLOAT/DOUBLE/REAL) always gets 0 —
              the node-level surrogateKeyValue applies to the surrogate key column only; override per column with @zeroKey(value). #}
              {%- elif col.dataType[:3] | upper in ('NUM', 'INT', 'DEC', 'FLO', 'DOU', 'REA', 'BIG', 'SMA', 'TIN', 'BYT') -%}
                  {%- set ns.zk_type = 'numeric' -%}
                  {%- set ns.zk_value = 0 -%}
              {%- elif col.dataType | upper in ('BOOL', 'BOOLEAN') -%}
                  {%- set ns.zk_type = 'boolean' -%}
                  {%- set ns.zk_value = zkParams[3] if zkParams | length > 3 else true -%}
              {%- elif col.dataType[:4] | upper in ('DATE', 'TIME') -%}
                  {%- set ns.zk_type = 'datetime' -%}
                  {%- set ns.zk_value = zkParams[2] if zkParams | length > 2 else '1900-01-01 00:00:00' -%}
              {%- endif -%}
          {%- endif -%}

          {# Format the resolved value #}
          {%- if ns.zk_type == 'numeric' -%}
              {{ ns.zk_value }}
          {%- elif ns.zk_type == 'variant' -%}
              PARSE_JSON('null')
          {%- elif ns.zk_value is not none -%}
              {%- if ns.zk_type == 'boolean' -%}
                  {{ ns.zk_value | upper }}

              {%- elif ns.zk_type == 'datetime' -%}
                  {# Parsed as a TIMESTAMP literal, then cast so DATE / DATETIME / TIME columns get a value of their own type. #}
                  CAST(TIMESTAMP '{{ ns.zk_value }}' AS {{ col.dataType }})

              {%- elif ns.zk_type == 'string' -%}
                  {# Node-level default: pasted verbatim, same as the column-level override — supply your own quotes in the annotation, e.g. "'UNKNOWN'". #}
                  {{ ns.zk_value }}

              {%- else -%}
                  {# Column-level @zeroKey override: pasted verbatim, exactly as the user wrote it — #}
                  {# they supply their own quotes for a string, or a full expression like CAST(...). #}
                  {{ ns.zk_value }}
              {%- endif -%}

          {%- else -%}
              NULL
          {%- endif -%}

      {%- endmacro -%}
name: macro
type: Macro
