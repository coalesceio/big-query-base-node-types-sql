fileVersion: 1
id: "1"
macroString: |

  {#===========================================================================
    get_materialization_type(value): normalizes @materializationType — lower case,
    spaces trimmed/collapsed ('  Transient  TABLE' -> 'transient table'); '' when missing.
    Kept here because initialize_node_variables() uses it.
  ===========================================================================#}
  {%- macro get_materialization_type(value) -%}
      {{- (value | default('', true) | string).split() | join(' ') | lower -}}
  {%- endmacro -%}

  {#===========================================================================
    initialize_node_variables(nsNodeVariables): fills nsNodeVariables from
    desiredState / currentState. Called once, right below.
  ===========================================================================#}
  {%- macro initialize_node_variables(nsNodeVariables) -%}

    {#- Normalized materialization types. The run template has neither state, only node. #}
    {%- if currentState is defined and currentState -%}
      {%- set nsNodeVariables.currentMatType = get_materialization_type(currentState.node.materializationType) -%}
    {%- endif -%}
    {%- if desiredState is defined and desiredState -%}
      {%- set nsNodeVariables.desiredMatType = get_materialization_type(desiredState.node.materializationType) -%}
    {%- elif currentState is not defined and node is defined and node -%}
      {%- set nsNodeVariables.desiredMatType = get_materialization_type(node.materializationType) -%}
    {%- endif -%}

    {%- if currentState is defined and currentState -%}
      {%- set nsNodeVariables.curObjectNameFullPath = ref_no_link(currentState.node.location.name, currentState.node.name) -%}
      {%- set nsNodeVariables.cloneObjectNameFullPath = ref_no_link(currentState.node.location.name, currentState.node.name + '_COALESCE_INTERNAL_TABLE') -%}

    {%- endif -%}

    {%- if desiredState is defined and desiredState -%}
      {%- set nsNodeVariables.desObjectNameFullPath = ref_no_link(node.location.name, node.name) -%}
    {%- endif -%}

    {#- Redeploy: tables are altered on the clone (swapped in afterwards), views in place #}
    {%- if currentState is defined and currentState and desiredState is defined and desiredState -%}
      {%- set nsNodeVariables.alterObjectNameFullPath = nsNodeVariables.desObjectNameFullPath
                                                        if nsNodeVariables.desiredMatType == 'view'
                                                        else nsNodeVariables.cloneObjectNameFullPath -%}
    {%- endif -%}

    {#- Redeploy: current columns with no desired column of the same id are being dropped
        (a column without @id has its name as id, so renaming it drops and re-adds it) #}
    {%- if currentState is defined and currentState and desiredState is defined and desiredState -%}
      {%- for curCol in currentState.columns -%}
        {%- set idStillDesired = columns | default([]) | selectattr('id', 'equalto', curCol.id) | list -%}
        {%- if not idStillDesired -%}
          {%- set nsNodeVariables.droppedColumns = nsNodeVariables.droppedColumns + ['"' + curCol.name + '"'] -%}
        {%- endif -%}
        {#- Same id, new name: the column is renamed (old name recorded) #}
        {%- if idStillDesired and (idStillDesired | first).name != curCol.name -%}
          {%- set nsNodeVariables.renamedColumns = nsNodeVariables.renamedColumns + ['"' + curCol.name + '"'] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}

    {#- Cluster key terms from @clusterKey(<position>, "<expression>"), ordered by position.
        A term is the expression, or the quoted column name when none is given. #}
    {%- set nsCluster = namespace(desired=[], current=[]) -%}
    {%- if desiredState is defined and desiredState -%}
      {%- for col in columns -%}
        {%- for cluster in col.clusterKey | default([]) -%}
          {%- set nsCluster.desired = nsCluster.desired + [{"position": cluster.parameters[0] | int,
                                                             "term": cluster.parameters[1] | default('"' + col.name + '"', true)}] -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- set nsNodeVariables.desiredClusterKey = nsCluster.desired | sort(attribute='position') | map(attribute='term') | list -%}
    {%- endif -%}
    {%- if currentState is defined and currentState -%}
      {%- for col in currentState.columns -%}
        {%- for cluster in col.clusterKey | default([]) -%}
          {%- set nsCluster.current = nsCluster.current + [{"position": cluster.parameters[0] | int,
                                                             "term": cluster.parameters[1] | default('"' + col.name + '"', true)}] -%}
        {%- endfor -%}
        {%- if col.clusterKey | default([]) | length > 0 -%}
          {%- set nsNodeVariables.currentClusterKeyColumns = nsNodeVariables.currentClusterKeyColumns + ['"' + col.name + '"'] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set nsNodeVariables.currentClusterKey = nsCluster.current | sort(attribute='position') | map(attribute='term') | list -%}
    {%- endif -%}

  {%- endmacro -%}

  {#===========================================================================
    nsNodeVariables: shared per-render state for the templates and alter_ macros
      desiredMatType / currentMatType       normalized type, '' when absent
                                            (desired falls back to node in run)
      des/curObjectNameFullPath             "DB"."SCHEMA"."NAME"
      cloneObjectNameFullPath               <current name>_COALESCE_INTERNAL_TABLE
      alterObjectNameFullPath               what alter_ macros change: clone (table) / view
      droppedColumns / renamedColumns       quoted current column names
      desired/currentClusterKey             CLUSTER BY terms, by position
      currentClusterKeyColumns              current columns with @clusterKey
      clusterKeyDropped / metaDataChanged   set by the redeploy macros
  ===========================================================================#}
  {%- set nsNodeVariables = namespace(desiredMatType = "",
                                      currentMatType = "",
                                      desObjectNameFullPath = "",
                                      curObjectNameFullPath = "",
                                      cloneObjectNameFullPath = "",
                                      alterObjectNameFullPath = "",
                                      droppedColumns = [],
                                      renamedColumns = [],
                                      desiredClusterKey = [],
                                      currentClusterKey = [],
                                      currentClusterKeyColumns = [],
                                      clusterKeyDropped = false,
                                      metaDataChanged = false) -%}
  {{- initialize_node_variables(nsNodeVariables) -}}



  {# ========================================================================
  Purpose          : Executes data quality tests associated with the node
                      and its columns, based on the configured run order.
                      Supports running tests either before or after data
                      insertion, and respects the test continuation
                      behavior on failure.
  Input Parameters : runOrder (String)
                      - Determines when the tests should be executed.
                          Expected values: 'Before' or 'After'
  Returns          : Rendered SQL statements for executing the applicable
                      node-level and column-level data quality tests.
                      No output is generated if tests are disabled.
  ========================================================================= #}
  {%- macro run_tests(runOrder) -%}

    {%- set columnContinueOnFailure = true -%}

    {%- if get_boolean_config("disableTests") != "true" -%}
        {%- if runOrder == "After" -%}
            {%- for col in columns -%}
                {%- set colName = '`' + col.name + '`' -%}
                {%- set accepted = col.accepted_values if (col.accepted_values is sequence and col.accepted_values is not mapping) else [] -%}
                {%- set rejected = col.rejected_values if (col.rejected_values is sequence and col.rejected_values is not mapping) else [] -%}
                {%- set target = ref(node.location.name, node.name) -%}
                {%- if col.not_null is defined -%}
                    {{ test_stage(col.name + ': not_null', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NULL
                {%- endif -%}
                {%- if col.uniqueness is defined -%}
                    {{ test_stage(col.name + ': uniqueness', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    GROUP BY {{ colName }}
                    HAVING COUNT(*) > 1
                {%- endif -%}
                {%- if col.empty is defined -%}
                    {{ test_stage(col.name + ': empty', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NOT NULL AND TRIM({{ colName }}) = ''
                {%- endif -%}
                {%- if accepted | length > 0 -%}
                    {{ test_stage(col.name + ': accepted_values', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NOT NULL
                    AND {{ colName }} NOT IN ({%- for v in accepted -%} {{ v.parameters[0] }} {%- if not loop.last -%}, {%- endif -%}{%- endfor -%})
                {%- endif -%}
                {%- if rejected | length > 0 -%}
                    {{ test_stage(col.name + ': rejected_values', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IN ({%- for v in rejected -%} {{ v.parameters[0] }} {%- if not loop.last -%}, {%- endif -%}{%- endfor -%})
                {%- endif -%}
                {%- if col.min_max is defined and col.min_max.parameters is defined -%}
                    {{ test_stage(col.name + ': min_max', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NOT NULL
                    AND ({{ colName }} < {{ col.min_max.parameters[0] }} OR {{ colName }} > {{ col.min_max.parameters[1] }})
                {%- endif -%}
                {%- if col.min_value is defined and col.min_value.parameters is defined -%}
                    {{ test_stage(col.name + ': min_value', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NOT NULL AND {{ colName }} < {{ col.min_value.parameters[0] }}
                {%- endif -%}
                {%- if col.max_value is defined and col.max_value.parameters is defined -%}
                    {{ test_stage(col.name + ': max_value', columnContinueOnFailure) }}
                    SELECT {{ colName }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NOT NULL AND {{ colName }} > {{ col.max_value.parameters[0] }}
                {%- endif -%}
                {%- if col.freshness is defined and col.freshness.parameters is defined -%}
                    {{ test_stage(col.name + ': freshness', columnContinueOnFailure) }}
                    SELECT MAX(CAST({{ colName }} AS DATETIME)) AS `LATEST_VALUE`
                    FROM {{ target }}
                    HAVING MAX(CAST({{ colName }} AS DATETIME)) IS NULL
                        OR MAX(CAST({{ colName }} AS DATETIME)) < DATETIME_SUB(CURRENT_DATETIME(), INTERVAL {{ col.freshness.parameters[0] }} {{ col.freshness.parameters[1] | default('DAY', true) }})
                {%- endif -%}
                {%- if col.relative_time is defined and col.relative_time.parameters is defined -%}
                    {%- set other = '`' + col.relative_time.parameters[1] + '`' -%}
                    {{ test_stage(col.name + ': relative_time', columnContinueOnFailure) }}
                    SELECT {{ colName }}, {{ other }}
                    FROM {{ target }}
                    WHERE {{ colName }} IS NOT NULL AND {{ other }} IS NOT NULL
                    AND NOT ({{ colName }} {{ col.relative_time.parameters[0] }} {{ other }})
                {%- endif -%}
            {%- endfor -%}
        {%- endif -%}

          {%- set ns = namespace(cnt=0) -%}
          {%- for test in config.tests | default([]) -%}
              {%- if test is mapping and test.parameters is defined -%}
                  {%- if test.parameters[2] | default("After") == runOrder -%}
                      {%- set ns.cnt = ns.cnt + 1 -%}
                      {{ test_stage(
                          ('Pre Load Test ' if runOrder == 'Before' else 'Post Load Test ') ~ ns.cnt,
                          test.parameters[1] | default(true)
                      ) }}
                      {{ test.parameters[0] }}
                  {%- endif -%}
              {%- endif -%}
          {%- endfor -%}

      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
  Description:
  Generates a deterministic hash value by combining and hashing all column values associated with the given `hash_name` using the `@inHash` annotation.

  Input: `hash_name` (string) - The hash group identifier used in `@inHash("<hash_name>")` to group columns for hashing.

  Output: - Returns a SQL expression of type `STRING`:
          - A SHA1 hash of concatenated column values  
          - Returns `NULL` if no columns are mapped to the given hash group
  ====================================================================================================#}
  {%- macro get_hash(hash_name, algo='SHA1', delimiter='||') -%}

      {%- set cols = namespace(items=[]) -%}
      {%- set algo_upper = algo | upper -%}

      {# Collect columns participating in this hash #}
      {%- for col in sources[0].columns -%}

          {%- if col.inHash is defined -%}
              {%- for p in col.inHash -%}
                  {%- set parts = p.parameters[0] -%}
                  {%- set position = p.parameters[1] | int -%}
                  {%- set hash = p.parameters[0] -%}

                  {%- if hash == hash_name -%}
                      {%- set cols.items = cols.items + [{
                          "position": position,
                          "column": get_source_transform(col)
                      }] -%}
                  {%- endif -%}
              {%- endfor -%}
          {%- endif -%}
      {%- endfor -%}

      {%- if cols.items | length == 0 -%}
          NULL
      {%- else -%}
          {%- set sorted_cols = cols.items | sort(attribute='position') -%}
          {# Define algo wrappers #}
          {%- set algo_start = algo_upper + '(' -%}
          {%- set algo_end = ')' -%}

          TO_HEX(
              {{ algo_start }}
                  {%- for c in sorted_cols -%}
                      IFNULL(CAST({{ c.column }} AS STRING), 'null')
                      {%- if not loop.last -%}
                          || {%- if delimiter != '' -%} '{{ delimiter }}' || {%- endif -%}
                      {%- endif -%}
                  {%- endfor -%}
              {{ algo_end }}
          )
      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
  get_boolean_config(flag)

  Description:
      Extracts the boolean value of a configuration flag, supporting both
      annotation formats:
      - @flag
      - @flag(true) / @flag(false)

  Input:
      flag: Name of the boolean configuration flag, e.g. "truncateBefore",
          "testsEnabled", or "clusterDefined".

  Examples:
      @truncateBefore
      -> config["truncateBefore"] = true
      -> Output: true

      @truncateBefore(true)
      -> config["truncateBefore"] = { parameters: [true] }
      -> Output: true

      @truncateBefore(false)
      -> config["truncateBefore"] = { parameters: [false] }
      -> Output: false

      No annotation
      -> config["truncateBefore"] is not defined
      -> Output: empty

  Usage:
      {%- if get_boolean_config("truncateBefore") | trim | lower == "true" -%}
      ...
      {%- endif -%}
  ====================================================================================================#}
  {%- macro get_boolean_config(flag) -%}
      {%- if config[flag] is defined -%}
          {%- if config[flag] is boolean -%}
              {{- config[flag] | trim | lower -}}
          {%- elif config[flag].parameters is defined and config[flag].parameters|length > 0 -%}
              {{- config[flag].parameters[0] | trim | lower -}}
          {%- endif -%}
      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
  Table DDL clause macros

  Each macro builds one complete clause of the CREATE TABLE statement from the annotations of a node
  state, or returns an empty string when the clause does not apply. The node state is passed in
  (desiredState.config / desiredState.columns, or the currentState equivalents), so the advanced-deploy
  create template can render the same clause for both states and compare them.
  ====================================================================================================#}

  {#===================================================================================================
  get_partition_by_sql(nodeConfig)

  Description:
      Builds the PARTITION BY clause from the @partitionBy(expression) annotation. The column or
      expression is written as-is, so it covers every BigQuery partition kind:
      - ingestion time   : _PARTITIONDATE, or e.g. DATE_TRUNC(_PARTITIONTIME, MONTH)
      - time-unit column : a DATE column, or e.g. DATE(ts_col), TIMESTAMP_TRUNC(ts_col, HOUR)
      - integer range    : e.g. RANGE_BUCKET(int_col, GENERATE_ARRAY(0, 100, 10))

  Examples:
      @partitionBy("_PARTITIONDATE")                       -> PARTITION BY _PARTITIONDATE
      @partitionBy("ORDER_DATE")                           -> PARTITION BY ORDER_DATE
      @partitionBy("RANGE_BUCKET(ID, GENERATE_ARRAY(0, 1000, 10))")
                                                           -> PARTITION BY RANGE_BUCKET(ID, GENERATE_ARRAY(0, 1000, 10))
      No annotation                                        -> empty
  ====================================================================================================#}
  {%- macro get_partition_by_sql(nodeConfig) -%}
      {%- set partExpr = (nodeConfig.partitionBy.parameters[0] | default('', true) | string | trim)
              if (nodeConfig.partitionBy is defined and nodeConfig.partitionBy.parameters is defined and nodeConfig.partitionBy.parameters | length > 0)
              else '' -%}
      {%- if partExpr | length > 0 -%}
          PARTITION BY {{ partExpr }}
      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
  get_primary_key_sql(nodeColumns)

  Description:
      Builds the PRIMARY KEY table constraint from the @primaryKey(<position>) column annotation.
      Columns are ordered by <position> (lowest first); columns with the same position keep node column order.
      BigQuery primary keys are never enforced, so NOT ENFORCED is always added.

  Examples:
      @primaryKey(1) on N_NATIONKEY                        -> PRIMARY KEY (`N_NATIONKEY`) NOT ENFORCED
      @primaryKey(1) on N_REGIONKEY, @primaryKey(2) on N_NATIONKEY
                                                           -> PRIMARY KEY (`N_REGIONKEY`, `N_NATIONKEY`) NOT ENFORCED
      No column marked                                     -> empty
  ====================================================================================================#}
  {%- macro get_primary_key_sql(nodeColumns) -%}
      {%- set pk = namespace(items=[]) -%}
      {%- for col in nodeColumns -%}
          {%- if col.primaryKey is defined -%}
              {%- set pkParams = col.primaryKey.parameters if (col.primaryKey is mapping and col.primaryKey.parameters is defined) else [] -%}
              {%- set pk.items = pk.items + [{
                      "position": (pkParams[0] | int(0)) if pkParams | length > 0 else 0,
                      "column": '`' + col.name + '`'
                  }] -%}
          {%- endif -%}
      {%- endfor -%}
      {%- if pk.items | length > 0 -%}
          PRIMARY KEY ({{ pk.items | sort(attribute='position') | map(attribute='column') | join(', ') }}) NOT ENFORCED
      {%- endif -%}
  {%- endmacro -%}

  {#===================================================================================================
  get_clusterby_sql(nodeColumns)

  Description:
      Builds the CLUSTER BY clause from the @clusterKey(<position>) column annotation.
      Columns are ordered by <position> (lowest first); columns with the same position keep node column
      order. BigQuery clusters by plain top-level columns only (no expressions, at most 4 columns).

  Examples:
      @clusterKey(1) on N_REGIONKEY, @clusterKey(2) on N_NAME -> CLUSTER BY `N_REGIONKEY`, `N_NAME`
      No column marked                                        -> empty
  ====================================================================================================#}
  {%- macro get_clusterby_sql(nodeColumns) -%}
      {%- set cols = namespace(items=[]) -%}
      {%- for col in nodeColumns -%}
          {%- if col.clusterKey is defined -%}
              {%- set clusterParams = col.clusterKey.parameters if (col.clusterKey is mapping and col.clusterKey.parameters is defined) else [] -%}
              {%- set cols.items = cols.items + [{
                      "position": (clusterParams[0] | int(0)) if clusterParams | length > 0 else 0,
                      "column": '`' + col.name + '`'
                  }] -%}
          {%- endif -%}
      {%- endfor -%}
      {%- if cols.items | length > 0 -%}
          CLUSTER BY {{ cols.items | sort(attribute='position') | map(attribute='column') | join(', ') }}
      {%- endif -%}
  {%- endmacro -%}


  {####################################################################################################################################
    Macro : get_tag_full_name(bareTagName)

    Description:
      Fully qualifies a bare tag name (e.g. "cost_center") with the GCP project of this node's own
      location, since BigQuery tag keys are namespaced by project: <project-id>/<tagName>. That way
      @tag annotations only need the tag's own name. A name that already contains "/" (e.g. a key
      owned by another project, or an org-level key "123456789/env") is returned as-is.

    Output:
      cls-dev-bigquery/cost_center
  ####################################################################################################################################}
  {%- macro get_tag_full_name(bareTagName) -%}
      {%- set tagName = bareTagName | string | trim -%}
      {%- if '/' in tagName -%}
          {{- tagName -}}
      {%- else -%}
          {%- set locs = desiredState.storageLocations if (desiredState is defined and desiredState) else storageLocations -%}
          {%- set project = locs | selectattr('name', 'equalto', node.location.name) | map(attribute='database') | first -%}
          {{- project ~ '/' ~ tagName -}}
      {%- endif -%}
  {%- endmacro -%}

  {####################################################################################################################################
    Macro : find_duplicate_tag_names(tagList)

    Description:
      Finds tag names that resolve to the same fully-qualified tag key as another entry in a set of
      @tag(<tagName>, <tagValue>) annotations — pass config.tag. A BigQuery table can hold only one
      value per tag key, so any repeat of the same key is a duplicate, even with different values
      (e.g. "env" and "cls-dev-bigquery/env" on a node in that project).

    Output:
      "cost_center, env" (comma-separated duplicate names) or '' (empty string) when none.
  ####################################################################################################################################}
  {%- macro find_duplicate_tag_names(tagList) -%}
      {%- set ns = namespace(entries=[], dupes=[]) -%}
      {%- for t in ([tagList] if tagList is mapping else tagList | default([], true)) -%}
          {%- set ns.entries = ns.entries + [{"key": get_tag_full_name(t.parameters[0]), "name": t.parameters[0]}] -%}
      {%- endfor -%}
      {%- for e in ns.entries -%}
          {%- if (ns.entries | selectattr('key', 'equalto', e.key) | list | length) > 1 and e.name not in ns.dupes -%}
              {%- set ns.dupes = ns.dupes + [e.name] -%}
          {%- endif -%}
      {%- endfor -%}
      {{- ns.dupes | join(', ') -}}
  {%- endmacro -%}

  {####################################################################################################################################
    Macro : get_tags_sql(tagList)

    Description:
      Generates the tags table option for a set of repeatable @tag(<tagName>, <tagValue>)
      annotations — pass config.tag. BigQuery takes tags inside the table's single OPTIONS(...) clause,
      so get_table_options_sql adds this entry there.

    Output:
      tags = [('cls-dev-bigquery/cost_center', 'finance'), ('cls-dev-bigquery/env', 'prod')]
      or '' (empty string) when tagList has no @tag annotations.
  ####################################################################################################################################}
  {%- macro get_tags_sql(tagList) -%}
      {%- set ns = namespace(items=[]) -%}
      {%- for t in ([tagList] if tagList is mapping else tagList | default([], true)) -%}
          {%- set ns.items = ns.items + ["('" ~ (get_tag_full_name(t.parameters[0]) | replace("'", "\\'")) ~ "', '" ~ (t.parameters[1] | string | trim | replace("'", "\\'")) ~ "')"] -%}
      {%- endfor -%}
      {%- if ns.items | length > 0 -%}
          tags = [{{ ns.items | join(', ') }}]
      {%- endif -%}
  {%- endmacro -%}


  {#===================================================================================================
  get_table_options_sql(nodeConfig, description, resetUnset=false)

  Description:
      Builds the table OPTIONS(...) clause (BigQuery allows only one) from:
      - @partitionExpirationDays(days) -> partition_expiration_days (not for RANGE_BUCKET integer-range partitions)
      - @tableExpiration(value)        -> expiration_timestamp
          whole number  : TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL <value> DAY)
          date/datetime : TIMESTAMP "<value>"; a date alone is extended to 23:59:59
      - @defaultRoundingMode(mode)     -> default_rounding_mode
      - @tag(name, value)              -> tags = [('<project-id>/<name>', '<value>'), ...] (see get_tags_sql)
      - the node description           -> description

      resetUnset=false (CREATE) : only options that are set are listed; empty when none are.
      resetUnset=true  (ALTER)  : every option is listed and an unset one is written as NULL, so
                                  ALTER TABLE ... SET OPTIONS(...) also clears options removed since the
                                  last deploy.

  Examples:
      @tableExpiration("30"), @defaultRoundingMode("ROUND_HALF_EVEN")
          -> OPTIONS(expiration_timestamp = TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 30 DAY), default_rounding_mode = 'ROUND_HALF_EVEN')
      No options, resetUnset=false
          -> empty
  ====================================================================================================#}
  {%- macro get_table_options_sql(nodeConfig, description, resetUnset=false) -%}
      {%- set opts = namespace(items=[]) -%}

      {# partition_expiration_days only applies to time-partitioned tables, i.e. any partition but an integer-range RANGE_BUCKET one #}
      {%- set partitionSql = get_partition_by_sql(nodeConfig) | trim -%}
      {%- set isTimePartitioned = partitionSql | length > 0 and 'RANGE_BUCKET' not in (partitionSql | upper) -%}
      {%- if isTimePartitioned -%}
          {%- if nodeConfig.partitionExpirationDays is defined and nodeConfig.partitionExpirationDays.parameters is defined and nodeConfig.partitionExpirationDays.parameters | length > 0 -%}
              {%- set opts.items = opts.items + ['partition_expiration_days = ' ~ nodeConfig.partitionExpirationDays.parameters[0]] -%}
          {%- elif resetUnset -%}
              {%- set opts.items = opts.items + ['partition_expiration_days = NULL'] -%}
          {%- endif -%}
      {%- endif -%}

      {%- set ns = namespace(expiration='') -%}
      {%- if nodeConfig.tableExpiration is defined and nodeConfig.tableExpiration.parameters is defined and nodeConfig.tableExpiration.parameters | length > 0 -%}
          {%- set exprnValue = nodeConfig.tableExpiration.parameters[0] | default('', true) | string | trim -%}
          {%- if exprnValue | length > 0 -%}
              {# A whole number is a day count; anything else is a date / datetime #}
              {%- if (exprnValue | int(-1)) >= 0 and (exprnValue | int(-1)) | string == exprnValue -%}
                  {%- set ns.expiration = 'TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL ' ~ exprnValue ~ ' DAY)' -%}
              {%- else -%}
                  {%- set ns.expiration = 'TIMESTAMP "' ~ exprnValue ~ ('"' if exprnValue | length > 11 else ' 23:59:59"') -%}
              {%- endif -%}
          {%- endif -%}
      {%- endif -%}
      {%- if ns.expiration | length > 0 -%}
          {%- set opts.items = opts.items + ['expiration_timestamp = ' ~ ns.expiration] -%}
      {%- elif resetUnset -%}
          {%- set opts.items = opts.items + ['expiration_timestamp = NULL'] -%}
      {%- endif -%}

      {%- set hasRoundingMode = nodeConfig.defaultRoundingMode is defined and nodeConfig.defaultRoundingMode.parameters is defined and nodeConfig.defaultRoundingMode.parameters | length > 0 -%}
      {%- set roundingMode = (nodeConfig.defaultRoundingMode.parameters[0] | default('', true) | string | trim) if hasRoundingMode else '' -%}
      {%- if roundingMode | length > 0 -%}
          {%- set opts.items = opts.items + ["default_rounding_mode = '" ~ roundingMode ~ "'"] -%}
      {%- elif resetUnset -%}
          {%- set opts.items = opts.items + ['default_rounding_mode = NULL'] -%}
      {%- endif -%}

      {%- set tagsOption = get_tags_sql(nodeConfig.tag) | trim -%}
      {%- if tagsOption | length > 0 -%}
          {%- set opts.items = opts.items + [tagsOption] -%}
      {%- elif resetUnset -%}
          {%- set opts.items = opts.items + ['tags = []'] -%}
      {%- endif -%}

      {%- if description | default('', true) | trim | length > 0 -%}
          {%- set opts.items = opts.items + ["description = '" ~ (description | escape) ~ "'"] -%}
      {%- elif resetUnset -%}
          {%- set opts.items = opts.items + ['description = NULL'] -%}
      {%- endif -%}

      {%- if opts.items | length > 0 -%}
          OPTIONS({{ opts.items | join(', ') }})
      {%- endif -%}
  {%- endmacro -%}

  {#===========================================================================
    Description: Checks that every column carries its own @id annotation, reporting duplicate column names and repeated @id values separately. Shared by validate_dimension_requirements.
    Input: hardFail (boolean, default false) — passed through from the calling validator.
    Output: Rendered test_stage(...) + SELECT statements for every check that fails.
    ===========================================================================#}
    {%- macro validate_column_ids(hardFail=false) -%}
        {# A column without a real @id has id equal to its name. When the SELECT repeats a column name, Coalesce renames the extra copy by appending a number (SYSTEM_CREATE_DATE -> SYSTEM_CREATE_DATE1) and drops its @id, so it lands here too — report that as a duplicate name rather than a missing ID. #}
        {%- set idCheck = namespace(missing=[], duplicates=[]) -%}
        {%- for col in columns if col.id == col.name -%}
            {%- set dup = namespace(of=none) -%}
            {%- for other in columns if other.name != col.name and col.name[:other.name | length] == other.name -%}
                {%- set suffix = col.name[other.name | length:] -%}
                {%- if (suffix | int(0)) > 0 and (suffix | int) | string == suffix -%}
                    {%- set dup.of = other.name -%}
                {%- endif -%}
            {%- endfor -%}
            {%- if dup.of is not none -%}
                {%- set idCheck.duplicates = idCheck.duplicates + ["'" ~ dup.of ~ "' (extra copy renamed to " ~ col.name ~ ")"] -%}
            {%- else -%}
                {%- set idCheck.missing = idCheck.missing + [col.name] -%}
            {%- endif -%}
        {%- endfor -%}

        {%- if idCheck.duplicates | length > 0 %}
            {%- set reason = "Duplicate column name: " ~ (idCheck.duplicates | join(', ')) ~ ". The SELECT returns more than one column with the same name — remove the extra column or give it a different alias." %}
            {{ test_stage("Duplicate Column Names", false) }}
            -- {{ reason }}
            {%- if hardFail %}
            SELECT 1/0
            {%- else %}
            SELECT 1
            {%- endif -%}
        {%- endif -%}

        {# Two columns given the same @id value. #}
        {%- set idDup = namespace(items=[]) -%}
        {%- for col in columns if col.id != col.name -%}
            {%- set sharing = columns | selectattr("id", "equalto", col.id) | map(attribute="name") | list -%}
            {%- set entry = "@id(\"" ~ col.id ~ "\") on " ~ (sharing | join(', ')) -%}
            {%- if sharing | length > 1 and entry not in idDup.items -%}
                {%- set idDup.items = idDup.items + [entry] -%}
            {%- endif -%}
        {%- endfor -%}
        {%- if idDup.items | length > 0 %}
            {%- set reason = "Duplicate column ID: " ~ (idDup.items | join('; ')) ~ '. Each column needs its own unique @id("<6 hex digits>") — change the repeated ID on all but one of them.' %}
            {{ test_stage("Duplicate Column IDs", false) }}
            -- {{ reason }}
            {%- if hardFail %}
            SELECT 1/0
            {%- else %}
            SELECT 1
            {%- endif -%}
        {%- endif -%}

        {%- if idCheck.missing | length > 0 %}
            {%- set reason = "These columns have no real system-generated ID (id equals the column name): " ~ (idCheck.missing | join(', ')) ~ '. Add a unique @id("<6 hex digits>") annotation to each of them.' %}
            {{ test_stage("Missing Column IDs", false) }}
            -- {{ reason }}
            {%- if hardFail %}
            SELECT 1/0
            {%- else %}
            SELECT 1
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

  {#===========================================================================
    Description: Validates a Dimension node's annotations (column IDs, business key, mergeStrategy, required system columns). Shared by create.sql.j2 and run.sql.j2.
    Input: hardFail (boolean, default false) — set true from create.sql.j2 so a failed check raises a real SQL error, since CREATE (unlike RUN) doesn't fail on row count alone.
    Output: Rendered test_stage(...) + SELECT statements for every check that fails.
    ===========================================================================#}
    {%- macro validate_dimension_requirements(hardFail=false) -%}
        {# CREATE does not fail on row count like RUN does, so hardFail forces a real SQL error instead. #}
        {%- macro fail_select(reason) -%}
            {%- if hardFail -%}
                SELECT 1/0
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endmacro -%}

        {# Every Dimension column must carry its own @id annotation. #}
        {{ validate_column_ids(hardFail) }}

        {# The same tag key may only be applied once to the table. #}
        {%- set nodeDupeTags = find_duplicate_tag_names(config.tag) | trim -%}
        {%- if nodeDupeTags | length > 0 %}
            {%- set reason = nodeDupeTags ~ " is applied multiple times on " ~ node.name ~ ". A BigQuery table can carry only one value per tag key." %}
            {{ test_stage('Duplicate Tags Found: ' + node.name, false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) -%}
        {%- if not hasBusinessKey %}
            {%- set reason = "Mark at least one column with @isBusinessKey to identify the dimension's natural/business key for SCD matching." %}
            {{ test_stage("Missing Business Key", false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length -%}
        {%- set changeTrackingCount = columns | selectattr("isChangeTracking") | list | length -%}

        {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 -%}
        {%- if mergeStrategyExplicit -%}
            {# Matched case-insensitively (must match run.sql.j2). #}
            {%- set mergeStrategyRaw = config.mergeStrategy.parameters[0] | string | trim -%}
            {%- set mergeStrategy = mergeStrategyRaw | lower -%}
        {%- else -%}
            {# No @mergeStrategy given — always default to changeTracking, regardless of which tracking columns are present. #}
            {%- set mergeStrategy = 'changetracking' -%}
        {%- endif -%}
        {%- set isSimpleUpsert = mergeStrategy == 'upsert' -%}
        {%- set isLastModifiedStrategy = mergeStrategy == 'lastmodified' -%}
        {%- set isChangeTrackingStrategy = mergeStrategy == 'changetracking' %}

        {# An unrecognised strategy would otherwise fall through to change tracking without any warning. #}
        {%- if not (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy) %}
            {%- set reason = '@mergeStrategy(`' ~ mergeStrategyRaw ~ '`) is not a recognised strategy. Use "changeTracking", "lastModified" or "upsert".' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {# These cross-checks only apply when @mergeStrategy is set explicitly, since an inferred strategy can not conflict with itself. #}
        {%- if mergeStrategyExplicit and isSimpleUpsert and (lastModifiedCount > 0 or changeTrackingCount > 0) %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("upsert") performs no change detection, so @isChangeTracking/@lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "changeTracking"/"lastModified" to use them.
            SELECT 1
        {%- endif -%}

        {%- if isChangeTrackingStrategy and lastModifiedCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
            SELECT 1
        {%- endif -%}

        {%- if isLastModifiedStrategy and lastModifiedCount == 0 %}
            {%- set reason = '@mergeStrategy(`lastModified`) requires exactly one column marked @lastModifiedTracking(<scdType>); none was found.' %}
            {{ test_stage('Invalid configuration: mergeStrategy', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif %}

        {# Only check "at most one @lastModifiedTracking column" once lastModified is the strategy in effect. #}
        {%- if isLastModifiedStrategy and lastModifiedCount > 1 %}
            {%- set reason = "@lastModifiedTracking may be applied to at most one column, but " ~ lastModifiedCount ~ " columns were marked. Remove the annotation from all but one column." %}
            {{ test_stage('Invalid configuration: Last Modified Column', false) }}
            -- {{ reason }}
            {{ fail_select(reason) }}
        {%- endif -%}

        {%- if isLastModifiedStrategy and changeTrackingCount > 0 %}
            {{ test_stage('Invalid configuration: mergeStrategy', true) }}
            -- @mergeStrategy("lastModified") does not use @isChangeTracking — those columns would be silently ignored (the last-modified comparison takes priority). Remove them, or switch mergeStrategy to "changeTracking" to use them.
            SELECT 1
        {%- endif -%}

        {%- set lastModifiedComparison = isLastModifiedStrategy and lastModifiedCount > 0 -%}
        {%- if hasBusinessKey -%}
            {%- if lastModifiedComparison %}
                {# More than one @lastModifiedTracking column is already flagged above — treat it as inconclusive (plain SCD1) until that is fixed. #}
                {%- if lastModifiedCount == 1 -%}
                    {%- set lastModifiedCol = columns | selectattr("lastModifiedTracking") | first %}
                    {# A bare @lastModifiedTracking (no scdType) comes through as `true`, not a mapping — guard for that and default scdType to 1. #}
                    {%- set lastModifiedTrackingParams = lastModifiedCol.lastModifiedTracking.parameters if (lastModifiedCol.lastModifiedTracking is mapping and lastModifiedCol.lastModifiedTracking.parameters is defined) else [] -%}
                    {%- set scdType = lastModifiedTrackingParams[0] | default(1, true) | string -%}
                    {%- if scdType not in ('1', '2') %}
                        {%- set reason = '@lastModifiedTracking\'s scdType parameter only accepts 1 or 2, but `' ~ scdType ~ '` was given on column ' ~ lastModifiedCol.name ~ '. Mention @lastModifiedTracking(scdType) explicitly — @lastModifiedTracking(1) to overwrite in place, or @lastModifiedTracking(2) to version the row.' %}
                        {{ test_stage('Invalid configuration: lastModifiedTracking scdType', false) }}
                        -- {{ reason }}
                        {{ fail_select(reason) }}
                    {%- endif -%}
                    {%- set type2Dimension = scdType == '2' -%}
                {%- else -%}
                    {%- set type2Dimension = false -%}
                {%- endif -%}
            {%- else -%}
                {%- set type2Dimension = changeTrackingCount > 0 -%}
            {%- endif -%}
        {%- else -%}
            {%- set type2Dimension = false -%}
        {%- endif -%}
        {%- if isSimpleUpsert %}
            {# @upsert always forces plain SCD1, no matter what @lastModifiedTracking/@isChangeTracking say. #}
            {%- set type2Dimension = false -%}
        {%- endif %}

        {# Collect every missing/misconfigured system column here so one run reports them all together instead of one at a time. #}
        {%- set missingSystemColumns = namespace(items=[]) %}

        {# @isSurrogateKey is normally optional (a customer may manage their own, e.g. SEQ.NEXTVAL) — required when @zeroKey needs one to match against, recommended for SCD Type 2. #}
        {%- set hasSurrogateKey = columns | selectattr("isSurrogateKey") | list | length > 0 -%}
        {%- if config.zeroKey is defined and not hasSurrogateKey -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSurrogateKey',
                'example': none,
                'reason': '@zeroKey requires a surrogate key column to match the zero record against; none was found on this node.'
            }] -%}
        {%- elif type2Dimension and not hasSurrogateKey -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': false,
                'annotation': '@isSurrogateKey',
                'example': '0 AS `' ~ node.name ~ '_KEY` @isSurrogateKey',
                'reason': 'Recommended for SCD Type 2, to give tables a stable per-version join key. Ignore this warning if you are managing your own surrogate key logic (e.g. a sequence NEXTVAL) instead of using @isSurrogateKey.'
            }] -%}
        {%- endif -%}

        {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 -%}
        {%- if not isSimpleUpsert and not hasSystemCreateDate -%}
            {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                'required': true,
                'annotation': '@isSystemCreateDate',
                'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate',
                'reason': 'Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row into CHANGE_DETECTION so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.'
            }] -%}
        {%- endif %}

        {# SYSTEM_UPDATE_DATE is required for both SCD Type 1 and Type 2. #}
        {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 -%}
        {%- if not isSimpleUpsert and not hasSystemUpdateDate -%}
            {%- if type2Dimension -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemUpdateDate',
                    'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate',
                    'reason': 'Required because this is an SCD Type 2 dimension: SYSTEM_UPDATE_DATE is carried through from the current target row into CHANGE_DETECTION/MERGE_ROWS so it can be stamped with CURRENT_TIMESTAMP whenever a new or changed version is inserted, marking when that version became active.'
                }] -%}
            {%- else -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemUpdateDate',
                    'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate',
                    'reason': 'Required for SCD Type 1: without it there\'s no way to tell when a row\'s attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again.'
                }] -%}
            {%- endif -%}
        {%- endif -%}

        {# The remaining system columns are only required for SCD Type 2. #}
        {%- if type2Dimension -%}
            {%- set hasSystemVersion = columns | selectattr("isSystemVersion") | list | length > 0 -%}
            {%- if not hasSystemVersion -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemVersion',
                    'example': '1 AS "SYSTEM_VERSION" @isSystemVersion',
                    'reason': 'Required because this is an SCD Type 2 dimension (a versioned last-modified column, or an @isChangeTracking column, was found): SYSTEM_VERSION is what distinguishes successive versions of the same business key, and it\'s what the outer MERGE\'s ON clause uses (alongside the business key) to target the exact row version being expired or matched.'
                }] -%}
            {%- endif -%}

            {%- set hasSystemCurrentFlag = columns | selectattr("isSystemCurrentFlag") | list | length > 0 -%}
            {%- if not hasSystemCurrentFlag -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemCurrentFlag',
                    'example': '\'Y\' AS "SYSTEM_CURRENT_FLAG" @isSystemCurrentFlag',
                    'reason': 'Required because this is an SCD Type 2 dimension: the CHANGE_DETECTION CTE filters TARGET_CURRENT down to WHERE SYSTEM_CURRENT_FLAG = \'Y\' to find the one active row per business key to compare the incoming source row against — without it there\'s no way to tell which of possibly several historical versions is the current one.'
                }] -%}
            {%- endif -%}

            {%- set hasSystemEndDate = columns | selectattr("isSystemEndDate") | list | length > 0 -%}
            {%- if not hasSystemEndDate -%}
                {%- set missingSystemColumns.items = missingSystemColumns.items + [{
                    'required': true,
                    'annotation': '@isSystemEndDate',
                    'example': 'CAST(\'2999-12-31 00:00:00\' AS TIMESTAMP) AS "SYSTEM_END_DATE" @isSystemEndDate',
                    'reason': 'Required because this is an SCD Type 2 dimension: SYSTEM_END_DATE is what gets set to the expiry timestamp when a changed row\'s prior version is expired, and to the far-future sentinel on every newly inserted current version — without it there\'s no way to bound how long each historical version was active.'
                }] -%}
            {%- endif -%}
        {%- endif -%}

        {%- if missingSystemColumns.items | length > 0 -%}
            {%- set anyRequired = missingSystemColumns.items | selectattr('required') | list | length > 0 %}
            {# If @isSurrogateKey is the only thing flagged, use a neutral heading since it may just be a custom surrogate key setup. #}
            {%- set onlySurrogateKeyFlagged = missingSystemColumns.items | length == 1 and missingSystemColumns.items[0].annotation == '@isSurrogateKey' and not missingSystemColumns.items[0].required -%}
            {%- set stageName = 'Surrogate Key Not Set/Using Custom Surrogate Key Logic' if onlySurrogateKeyFlagged else 'Missing Required System Columns' %}
            {{ test_stage(stageName, not anyRequired) }}
            {%- for item in missingSystemColumns.items %}
            -- {{ loop.index }}. [{{ 'REQUIRED' if item.required else 'RECOMMENDED' }}] {{ item.annotation }}
            {%- if item.example %}
            --    Example: {{ item.example }}
            {%- endif %}
            --    Reason: {{ item.reason }}
            {%- endfor %}
            {# Only hard-fail if a REQUIRED item is present; recommendations-only stays non-blocking. #}
            {%- if hardFail and anyRequired -%}
                {{ fail_select("Missing required system column(s): " ~ (missingSystemColumns.items | selectattr('required') | map(attribute='annotation') | join(', ')) ~ ". See the comments above for details.") }}
            {%- else -%}
                SELECT 1
            {%- endif -%}
        {%- endif -%}
    {%- endmacro -%}

  {#===========================================================================
    Description: Resolves the zero-key literal for a column (column-level @zeroKey wins, else node-level @zeroKey by dataType, else NULL).
    Input: col (object)
    Output: SQL literal for the resolved zero-key value.
  ===========================================================================#}
    {%- macro resolve_zero_key(col) -%}

        {%- set ns = namespace(zk_type=none, zk_value=none) -%}

        {# Column-level zeroKey #}
        {%- if col.zeroKey is defined
            and col.zeroKey.parameters is defined
            and col.zeroKey.parameters | trim | length > 0 -%}

            {%- set ns.zk_value = col.zeroKey.parameters[0] -%}

        {# Node-level zeroKey, matched by column dataType #}
        {%- else -%}
            {%- set zkParams = config.zeroKey.parameters if (config.zeroKey is defined and config.zeroKey.parameters is defined) else [] -%}
            {%- if col.dataType | upper in ('JSON', 'VARIANT') -%}
                {%- set ns.zk_type = 'variant' -%}
                {%- set ns.zk_value = none -%}
            {%- elif col.dataType[:3] | upper in ('VAR', 'CHA', 'STR', 'TEX') -%}
                {%- set ns.zk_type = 'string' -%}
                {%- set ns.zk_value = zkParams[1] if zkParams | length > 1 else "'UNKNOWN'" -%}
            {# Every numeric type (NUMBER/NUMERIC/DECIMAL, INT/INTEGER/BIGINT/SMALLINT/TINYINT/BYTEINT, FLOAT/DOUBLE/REAL) always gets 0 —
               the node-level surrogateKeyValue applies to the surrogate key column only; override per column with @zeroKey(value). #}
            {%- elif col.dataType[:3] | upper in ('NUM', 'INT', 'DEC', 'FLO', 'DOU', 'REA', 'BIG', 'SMA', 'TIN', 'BYT') -%}
                {%- set ns.zk_type = 'numeric' -%}
                {%- set ns.zk_value = 0 -%}
            {%- elif col.dataType | upper in ('BOOL', 'BOOLEAN') -%}
                {%- set ns.zk_type = 'boolean' -%}
                {%- set ns.zk_value = zkParams[3] if zkParams | length > 3 else true -%}
            {%- elif col.dataType[:4] | upper in ('DATE', 'TIME', 'TIMESTAMP') -%}
                {%- set ns.zk_type = 'datetime' -%}
                {%- set ns.zk_value = zkParams[2] if zkParams | length > 2 else '1900-01-01 00:00:00' -%}
            {%- endif -%}
        {%- endif -%}

        {# Format the resolved value #}
        {%- if ns.zk_type == 'numeric' -%}
            {{ ns.zk_value }}
        {%- elif ns.zk_type == 'variant' -%}
            PARSE_JSON('null')
        {%- elif ns.zk_value is not none -%}
            {%- if ns.zk_type == 'boolean' -%}
                {{ ns.zk_value | upper }}

            {%- elif ns.zk_type == 'datetime' -%}
                {# Parsed as a TIMESTAMP literal, then cast so DATE / DATETIME / TIME columns get a value of their own type. #}
                CAST(TIMESTAMP '{{ ns.zk_value }}' AS {{ col.dataType }})

            {%- elif ns.zk_type == 'string' -%}
                {# Node-level default: pasted verbatim, same as the column-level override — supply your own quotes in the annotation, e.g. "'UNKNOWN'". #}
                {{ ns.zk_value }}

            {%- else -%}
                {# Column-level @zeroKey override: pasted verbatim, exactly as the user wrote it — #}
                {# they supply their own quotes for a string, or a full expression like CAST(...). #}
                {{ ns.zk_value }}
            {%- endif -%}

        {%- else -%}
            NULL
        {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
    Description: Builds a datatype-aware condition that's TRUE when the source and target values differ.
    Input: src_expr (string), tgt_expr (string), data_type (string)
    Output: SQL boolean condition.
    ===========================================================================#}
    {%- macro safe_compare(src_expr, tgt_expr, data_type) -%}

        {%- set dt = data_type | upper -%}

        {%- if 'GEOGRAPHY' in dt -%}
            ST_ASBINARY({{ src_expr }}) IS DISTINCT FROM ST_ASBINARY({{ tgt_expr }})
        {%- else -%}
            {{ src_expr }} IS DISTINCT FROM {{ tgt_expr }}
        {%- endif -%}

    {%- endmacro -%}

    {#===========================================================================
    Description: Builds a datatype-aware equality condition for matching business keys. GEOGRAPHY/GEOMETRY can't be compared with =, so they're compared on their WKB binary form (exact match, still an equi-join).
    Input: left_expr (string), right_expr (string), data_type (string)
    Output: SQL boolean condition. NULL never matches, same as =.
    ===========================================================================#}
    {%- macro safe_equals(left_expr, right_expr, data_type) -%}

        {%- set dt = data_type | upper -%}

        {%- if 'GEOGRAPHY' in dt -%}
            ST_ASBINARY({{ left_expr }}) = ST_ASBINARY({{ right_expr }})
        {%- else -%}
            {{ left_expr }} = {{ right_expr }}
        {%- endif -%}

    {%- endmacro -%}

  {#=========================================================
    Initialize variables for node types that use the
    advanced deployment strategy
  ===========================================================#}
  {%- macro initializeNodeVariables(nsNodeVariables) %}

    {%- if currentState is defined %}
      {%- set currentProject = currentState.storageLocations
                                | selectattr('name', 'equalto', currentState.node.location.name)
                                | map(attribute='database')
                                | first %}
      {%- set currentDataset = currentState.storageLocations
                              | selectattr('name', 'equalto', currentState.node.location.name)
                              | map(attribute='schema')
                              | first %}
      {%- set nsNodeVariables.currentProjectDataset = currentProject + '.' + currentDataset %}

      {%- set nsNodeVariables.curObjectNameFullPath = ref_no_link(currentState.node.location.name, currentState.node.name) %}

    {%- endif %}

    {%- if desiredState is defined %}
      {%- set desiredProject = desiredState.storageLocations
                                | selectattr('name', 'equalto', desiredState.node.location.name)
                                | map(attribute='database')
                                | first %}
      {%- set desiredDataset = desiredState.storageLocations
                                | selectattr('name', 'equalto', desiredState.node.location.name)
                                | map(attribute='schema')
                                | first %}
      {%- set nsNodeVariables.desiredProjectDataset = desiredProject + '.' + desiredDataset %}

      {%- set nsNodeVariables.desObjectNameFullPath = ref_no_link(desiredState.node.location.name, desiredState.node.name) %}

    {%- endif %}

  {%- endmacro %}

  {###########################################################################################
  Purpose:
  Determines the correct BigQuery DROP object syntax based on the materialization type.

  Input:
  - materialization (string): The BigQuery object type to be dropped
    (e.g., table, view, materialized view, external table, snapshot, clone).

  Returns:
  - string: The appropriate DROP object keyword with IF EXISTS
    (e.g., 'TABLE IF EXISTS', 'VIEW IF EXISTS', 'MATERIALIZED VIEW IF EXISTS').
  #############################################################################################}
  {%- macro dropMaterialization(materialization) %}

      {%- if materialization in ['table', 'clone'] %}
          TABLE IF EXISTS
      {%- elif materialization == 'snapshot' %}
          SNAPSHOT TABLE IF EXISTS
      {%- elif materialization in ['view', 'authorized view'] %}
          VIEW IF EXISTS
      {%- elif materialization == 'materialized view' %}
          MATERIALIZED VIEW IF EXISTS
      {%- elif materialization == 'external table' %}
          EXTERNAL TABLE IF EXISTS
      {%- else %}
          TABLE IF EXISTS   {# safe default for BigQuery #}
      {%- endif %}

  {%- endmacro %}

  {#===========================================================================
    validate_materialization_type(allowedTypes): failing "Unsupported Materialization Type"
    check when the normalized type is not allowed. Call first in create and run.
  ===========================================================================#}
  {%- macro validate_materialization_type(allowedTypes=['table', 'transient table', 'view']) -%}
      {%- if nsNodeVariables.desiredMatType not in allowedTypes %}
          {{ test_stage('Unsupported Materialization Type: ' + node.name, false) }}
          -- '{{ node.materializationType | default('', true) }}' is not supported on {{ node.name }}; use one of: {{ allowedTypes | join(', ') }}
          {{ fail_sql() }}
      {%- endif %}
  {%- endmacro -%}

  {#===========================================================================
    validate_fact_requirements(hardFail): Fact checks (column ids, mergeStrategy, system
    columns). hardFail = true from create.
  ===========================================================================#}
  {%- macro validate_fact_requirements(hardFail=false) -%}

      {# Every Fact column must carry its own @id annotation. #}
      {{ validate_column_ids(hardFail) }}

      {# No @isBusinessKey column is valid for a Fact — it's loaded as a plain insert, so the mergeStrategy/tracking/system-column checks below don't apply. #}
      {%- set hasBusinessKey = columns | selectattr("isBusinessKey") | list | length > 0 | default(false) -%}

      {%- set lastModifiedCount = columns | selectattr("lastModifiedTracking") | list | length -%}

      {%- set mergeStrategyExplicit = config.mergeStrategy is defined and config.mergeStrategy.parameters is defined and config.mergeStrategy.parameters | length > 0 -%}
      {%- if mergeStrategyExplicit -%}
          {# Matched case-insensitively (must match run.sql.j2). #}
          {%- set mergeStrategyRaw = config.mergeStrategy.parameters[0] | string | trim -%}
          {%- set mergeStrategy = mergeStrategyRaw | lower -%}
      {%- else -%}
          {# No @mergeStrategy given — always default to changeTracking, regardless of which tracking columns are present. #}
          {%- set mergeStrategy = 'changetracking' -%}
      {%- endif -%}
      {%- set isSimpleUpsert = mergeStrategy == 'upsert' -%}
      {%- set isLastModifiedStrategy = mergeStrategy == 'lastmodified' -%}
      {%- set isChangeTrackingStrategy = mergeStrategy == 'changetracking' -%}
      {%- set isAllColumnMatch = mergeStrategy == 'allcolumnmatch' %}

      {# An unrecognised strategy would otherwise fall through to change tracking without any warning. #}
      {%- if not (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy or isAllColumnMatch) %}
          {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") is not a recognised strategy. Use "changeTracking", "lastModified", "upsert" or "allColumnMatch".' %}
          {{ test_stage('Invalid configuration: mergeStrategy', false) }}
          -- {{ reason }}
          {{ fail_sql(hardFail) }}
      {%- endif -%}

      {# @mergeStrategy always takes priority. An explicit changeTracking/lastModified/upsert merges on the business key, so a missing @isBusinessKey stops the load.
         Not for allColumnMatch, which needs no @isBusinessKey — every column is the match key. An unrecognised value is already flagged above. #}
      {%- if not hasBusinessKey and mergeStrategyExplicit and (isSimpleUpsert or isLastModifiedStrategy or isChangeTrackingStrategy) %}
          {%- set reason = '@mergeStrategy("' ~ mergeStrategyRaw ~ '") merges on the business key, but no column is marked @isBusinessKey. Mark the business key column(s) with @isBusinessKey, or remove @mergeStrategy to load the node as a plain insert.' %}
          {{ test_stage('Invalid configuration: No Business Key', false) }}
          -- {{ reason }}
          {{ fail_sql(hardFail) }}
      {%- endif -%}

      {# No @mergeStrategy and no business key = plain insert, so @lastModifiedTracking is never read. Warn only — the insert still runs. #}
      {%- if not hasBusinessKey and not mergeStrategyExplicit and lastModifiedCount > 0 %}
          {{ test_stage('Invalid configuration: No Business Key', true) }}
          -- No @mergeStrategy and no column marked @isBusinessKey, so this node is loaded as a plain insert — @lastModifiedTracking will be ignored. Mark the business key column(s) with @isBusinessKey and set @mergeStrategy("lastModified") to use it, or remove the annotation.
          SELECT 1
      {%- endif -%}

      {# allColumnMatch matches on every non-system column, so @isBusinessKey / @lastModifiedTracking are never read. Warn only — the merge still runs. #}
      {%- if isAllColumnMatch and hasBusinessKey %}
          {{ test_stage('Invalid configuration: mergeStrategy', true) }}
          -- @mergeStrategy("allColumnMatch") matches on every non-system column, so @isBusinessKey is ignored — all columns are used as the business key for comparison. Remove @isBusinessKey, or switch mergeStrategy to use it.
          SELECT 1
      {%- endif -%}

      {%- if isAllColumnMatch and lastModifiedCount > 0 %}
          {{ test_stage('Invalid configuration: mergeStrategy', true) }}
          -- @mergeStrategy("allColumnMatch") performs no change detection, so @lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "lastModified" to use them.
          SELECT 1
      {%- endif -%}

      {# These cross-checks only apply when @mergeStrategy is set explicitly, since an inferred strategy can't conflict with itself. #}
      {%- if hasBusinessKey and mergeStrategyExplicit and isSimpleUpsert and lastModifiedCount > 0 %}
          {{ test_stage('Invalid configuration: mergeStrategy', true) }}
          -- @mergeStrategy("upsert") performs no change detection, so @lastModifiedTracking columns are never read. Remove them, or switch mergeStrategy to "lastModified" to use them.
          SELECT 1
      {%- endif -%}

      {%- if hasBusinessKey and isChangeTrackingStrategy and lastModifiedCount > 0 %}
          {{ test_stage('Invalid configuration: mergeStrategy', true) }}
          -- @mergeStrategy("changeTracking") does not use @lastModifiedTracking — that column would be silently ignored. Remove it, or switch mergeStrategy to "lastModified".
          SELECT 1
      {%- endif -%}

      {%- if hasBusinessKey and isLastModifiedStrategy and lastModifiedCount == 0 %}
          {%- set reason = '@mergeStrategy("lastModified") requires exactly one column marked @lastModifiedTracking; none was found.' %}
          {{ test_stage('Invalid configuration: mergeStrategy', false) }}
          -- {{ reason }}
          {{ fail_sql(hardFail) }}
      {%- endif %}

      {# Only check "at most one @lastModifiedTracking column" once lastModified is the strategy in effect. #}
      {%- if hasBusinessKey and isLastModifiedStrategy and lastModifiedCount > 1 %}
          {%- set reason = "@lastModifiedTracking may be applied to at most one column, but " ~ lastModifiedCount ~ " columns were marked. Remove the annotation from all but one column." %}
          {{ test_stage('Invalid configuration: Last Modified Column', false) }}
          -- {{ reason }}
          {{ fail_sql(hardFail) }}
      {%- endif -%}

      {# Collect every missing/misconfigured system column here so one run reports them all together instead of one at a time. #}
      {%- set missingSystemColumns = namespace(items=[]) %}

      {%- set hasSystemCreateDate = columns | selectattr("isSystemCreateDate") | list | length > 0 -%}
      {%- if hasBusinessKey and not isSimpleUpsert and not isAllColumnMatch and not hasSystemCreateDate -%}
          {%- set missingSystemColumns.items = missingSystemColumns.items + [{
              'required': true,
              'annotation': '@isSystemCreateDate',
              'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate',
              'reason': 'Required because @mergeStrategy("changeTracking"/"lastModified") does change detection against the existing target row: SYSTEM_CREATE_DATE is carried through unchanged from that row into CHANGE_DETECTION so its original insert timestamp is preserved on every update, and only stamped with CURRENT_TIMESTAMP the one time a business key is first inserted.'
          }] -%}
      {%- endif %}

      {%- set hasSystemUpdateDate = columns | selectattr("isSystemUpdateDate") | list | length > 0 -%}
      {%- if hasBusinessKey and not isSimpleUpsert and not isAllColumnMatch and not hasSystemUpdateDate -%}
          {%- set missingSystemColumns.items = missingSystemColumns.items + [{
              'required': true,
              'annotation': '@isSystemUpdateDate',
              'example': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate',
              'reason': 'Required for SCD Type 1: without it there\'s no way to tell when a row\'s attributes were last changed — SYSTEM_CREATE_DATE is set once and never touched again.'
          }] -%}
      {%- endif -%}

      {%- if missingSystemColumns.items | length > 0 -%}
          {%- set anyRequired = missingSystemColumns.items | selectattr('required') | list | length > 0 %}
          {{ test_stage('Missing Required System Columns', not anyRequired) }}
          {%- for item in missingSystemColumns.items %}
          -- {{ loop.index }}. [{{ 'REQUIRED' if item.required else 'RECOMMENDED' }}] {{ item.annotation }}
          {%- if item.example %}
          --    Example: {{ item.example }}
          {%- endif %}
          --    Reason: {{ item.reason }}
          {%- endfor %}
          {# Only hard-fail if a REQUIRED item is present; recommendations-only stays non-blocking. #}
          {%- if hardFail and anyRequired -%}
              {{ fail_sql(hardFail) }}
          {%- else -%}
              SELECT 1
          {%- endif -%}
      {%- endif -%}
  {%- endmacro -%}



  {#===========================================================================
    run_pre_post_sql(runOrder): 'Pre' / 'Post' -> one "Pre-SQL <n>" / "Post-SQL <n>" stage
    per @preSQL / @postSQL statement.
  ===========================================================================#}
  {%- macro run_pre_post_sql(runOrder) -%}
      {%- set sqlList = config.preSQL if runOrder == 'Pre' else config.postSQL -%}
      {%- set ns = namespace(cnt=0) %}
      {%- for sql in sqlList | default([], true) %}
          {%- if sql is mapping and sql.parameters is defined %}
              {%- set ns.cnt = ns.cnt + 1 %}
              {{ stage(runOrder ~ '-SQL ' ~ ns.cnt) }}
              {{ sql.parameters[0] }}
          {%- endif %}
      {%- endfor %}
  {%- endmacro -%}
name: macro
type: Macro
