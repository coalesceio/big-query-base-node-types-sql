fileVersion: 2
id: "728"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Dimension 
    short: DIM
    plural: Dimensions
    tagColor: '#1E339A'

    enableCTESupport: true

    deployStrategy: advanced

    annotations:
        node:

        - name: partitionBy
          description: |-
            Partitions the target table.
            𝗶𝗻𝗴𝗲𝘀𝘁𝗶𝗼𝗻𝗧𝗶𝗺𝗲 partitions by load time — defaults to _PARTITIONDATE, or pass an expression such as DATE_TRUNC(_PARTITIONTIME, MONTH);
            𝘁𝗶𝗺𝗲𝗨𝗻𝗶𝘁𝗖𝗼𝗹𝘂𝗺𝗻 partitions by a DATE column name or an expression such as DATE_TRUNC(columnName, MONTH);
            𝗶𝗻𝘁𝗲𝗴𝗲𝗿𝗥𝗮𝗻𝗴𝗲 partitions by an expression such as RANGE_BUCKET(columnName, GENERATE_ARRAY(1, 100, 200)).
            ⚠️ On redeployment, partition changes drop and recreate the table.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: type
              type: string
              description: Partitioning strategy for the target table.
              isRequired: true
              default: ingestionTime
              example: timeUnitColumn
              options:
                - ingestionTime
                - timeUnitColumn
                - integerRange

            - name: expression
              type: string
              description: |-
                Column name or partition expression.
                Required for 𝘁𝗶𝗺𝗲𝗨𝗻𝗶𝘁𝗖𝗼𝗹𝘂𝗺𝗻 and 𝗶𝗻𝘁𝗲𝗴𝗲𝗿𝗥𝗮𝗻𝗴𝗲; optional for 𝗶𝗻𝗴𝗲𝘀𝘁𝗶𝗼𝗻𝗧𝗶𝗺𝗲.
              isRequired: false
              example: DATE_TRUNC(columnName, MONTH)

        - name: partitionExpirationDays
          description: |-
            Number of days to keep each partition before BigQuery deletes it.
            Applies only with @partitionBy of type 𝗶𝗻𝗴𝗲𝘀𝘁𝗶𝗼𝗻𝗧𝗶𝗺𝗲 or 𝘁𝗶𝗺𝗲𝗨𝗻𝗶𝘁𝗖𝗼𝗹𝘂𝗺𝗻.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: days
              type: number
              description: Partition expiration in days.
              isRequired: true
              example: 30

        - name: tableExpiration
          description: |-
            Sets when BigQuery deletes the target table.
            𝗱𝗮𝘆𝘀𝗙𝗿𝗼𝗺𝗡𝗼𝘄 expires the table the given number of days after it is created, e.g. 30;
            𝗲𝘅𝗮𝗰𝘁𝗗𝗮𝘁𝗲𝗧𝗶𝗺𝗲 expires it at a fixed point, e.g. 2026-12-31 or 2026-12-31 23:59:59 — a date alone expires at 23:59:59 that day.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: type
              type: string
              description: How the expiration value is interpreted.
              isRequired: true
              default: daysFromNow
              example: exactDateTime
              options:
                - daysFromNow
                - exactDateTime

            - name: value
              type: string
              description: Number of days for 𝗱𝗮𝘆𝘀𝗙𝗿𝗼𝗺𝗡𝗼𝘄, or a date / datetime for 𝗲𝘅𝗮𝗰𝘁𝗗𝗮𝘁𝗲𝗧𝗶𝗺𝗲.
              isRequired: true
              example: "30"

        - name: defaultRoundingMode
          description: |-
            Default rounding mode for NUMERIC and BIGNUMERIC values written to the table.
            If not specified, BigQuery uses 𝗥𝗢𝗨𝗡𝗗_𝗛𝗔𝗟𝗙_𝗔𝗪𝗔𝗬_𝗙𝗥𝗢𝗠_𝗭𝗘𝗥𝗢.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Rounding mode applied to the table.
              isRequired: true
              default: ROUND_HALF_AWAY_FROM_ZERO
              example: ROUND_HALF_EVEN
              options:
                - ROUND_HALF_AWAY_FROM_ZERO
                - ROUND_HALF_EVEN

        - name: writeMode
          description: |-
            Controls how data is written to the target table. 
            𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁 clears the table before loading, replacing its contents entirely;
            𝗮𝗽𝗽𝗲𝗻𝗱 inserts the new rows alongside whatever is already there.
            If not specified in the SQL, defaults to 𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁. 
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
              isRequired: true
              default: truncateInsert
              example: append
              options:
                - truncateInsert
                - append

        - name: mergeStrategy
          description: |-
            • Picks the change-detection method; different methods require different column annotations.
            • If not specified, defaults to changeTracking - 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭
            • The value is not case-sensitive; any other value fails the run.
            • Every strategy needs the SELECT/CTE to return exactly one row per business key, with no NULL business key — a pre-load test can handle this.
            • Ignored on views

            ◆ 𝗰𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴
              • Compares columns marked isChangeTracking (or, if none are marked, every plain attribute column) to detect a change.
              • 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 if any column is marked isChangeTracking, otherwise 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭.
              • Requires no lastModifiedTracking column

            ◆ 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱
              • Compares a single lastModifiedTracking timestamp column against the target's stored value.
              • Requires exactly one column marked lastModifiedTracking — the run fails if none is present.
              • 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 𝗼𝗿 𝟮 comes from that column's own 𝘀𝗰𝗱𝗧𝘆𝗽𝗲 parameter.
              • Requires no isChangeTracking column

            ◆ 𝘂𝗽𝘀𝗲𝗿𝘁
              • No change detection at all — a matched row is always updated, an unmatched row is inserted.
              • Doesn't assert any SCD type of its own — if the upstream SELECT/CTE already implements SCD1/SCD2 logic, this strategy just merges that result through as-is, without re-deriving or re-checking it.
              • The SELECT/CTE should return one row per business key (e.g. de-duplicated upstream).
              • System columns are optional; any that are present are written exactly as the SELECT/CTE computes them. SYSTEM_CREATE_DATE keeps its first-inserted value on update.
              • For SCD2 logic, match on a key that is unique per version (e.g. mark a per-version key column as isBusinessKey) and have the CTE return both the row that expires the old version and the new version.
              • Requires no isChangeTracking/lastModifiedTracking columns

            Agentic creation — before writing a new Dimension node's SELECT, ask the user (don't silently default):
            1. Which merge strategy do they want — upsert, changeTracking, or lastModified? If they don't know, explain the three options above and let them choose — don't pick changeTracking just because it's the fallback default.
            2. If they chose changeTracking or lastModified, ask whether they want SCD Type 1 (overwrite the row in place) or SCD Type 2 (expire the old row, insert a new version) — this decides whether to mark a column isChangeTracking (changeTracking) or use lastModifiedTracking(2) (lastModified), and whether the SCD Type 2 system columns (isSystemVersion/isSystemCurrentFlag/isSystemEndDate) are required.
            3. If upsert was chosen, skip step 2 entirely — upsert has no SCD type of its own.

        - name: zeroKey
          description: |-
            • Inserts a default "zero key" record into the target — a placeholder row used to catch unresolved foreign key lookups.
            • Numeric columns (integer, decimal, float) always get 0 — 𝘀𝘂𝗿𝗿𝗼𝗴𝗮𝘁𝗲𝗞𝗲𝘆𝗩𝗮𝗹𝘂𝗲 applies to the surrogate key column only. Override any column with a column-level zeroKey.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: surrogateKeyValue
              type: number
              description: Value used for the zero record's surrogate key column.
              isRequired: true
              example: 0

            - name: stringValue
              type: string
              description: Default value used for the zero record's string/varchar columns, pasted into the SQL verbatim — include your own quotes.
              isRequired: false
              default: "'UNKNOWN'"
              example: "'UNKNOWN'"

            - name: timestampValue
              type: string
              description: Default value used for the zero record's date/time/timestamp columns.
              isRequired: false
              default: "1900-01-01 00:00:00"
              example: "1900-01-01 00:00:00"

            - name: booleanValue
              type: boolean
              description: Default value used for the zero record's boolean columns.
              isRequired: false
              default: true

        - name: disableTests
          type: boolean
          description: |-
            Controls whether configured tests are skipped.
            Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
          isRequired: false
          default: false

        - name: tests
          description: |-
            Node-level data quality test.
            Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗿𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
            Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: preSQL
          description: |-
            SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
            Repeat the annotation to run multiple statements in the order they appear.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: |-
            SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
                Repeat the annotation to run multiple statements in the order they appear.
                𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: primaryKey
          description: |-
            Marks a column as part of the table's primary key.
            Mark every key column to build a composite key; the columns are added to the key in node column order.
            Presence enables the key — remove the annotation to drop the column from it.
            𝗡𝗼𝘁 𝗲𝗻𝗳𝗼𝗿𝗰𝗲𝗱 — BigQuery does not validate uniqueness; pair with uniqueness / not_null to test it.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false

        - name: clusterKey
          description: |-
            Marks this column as part of the table's CLUSTER BY key, at the given position
            (lowest first), e.g. clusterKey(1).
            BigQuery clusters by plain top-level columns only — no expressions — and allows at most 4 clustering columns.
            ⚠️ On redeployment, clustering changes drop and recreate the table.
            Ignored on views.
          allowsMultiple: true
          parameters:
            - name: position
              type: number
              isRequired: true
              example: 1

        - name: inHash
          description: |-
                Marks a column as an input to a generated hash key, grouped by 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲 and ordered within that group by 𝗵𝗮𝘀𝗵𝗢𝗿𝗱𝗲𝗿.
                Mark every column that should feed a given hash with the same 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲, then call the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡("<hashName>") macro elsewhere in the SELECT to produce the actual hash column from those marked columns.
                𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Group hash name shared by every column feeding the same hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Position of this column within its hash group, lowest first.
              example: 1

        - name: isBusinessKey
          description: |-
            • Marks a column as part of the business key used to match existing rows during the merge.
            • Ignored on views.

            Agentic creation — before writing the SELECT, ask the user which column(s) should be marked @isBusinessKey. Don't guess based on column naming (e.g. assuming a "_ID"/"_KEY" column, or the first natural-looking key) — the business key is a domain decision only the user can make, and getting it wrong silently breaks change detection for every row. A business key can be more than one column; ask whether it's composite.
          isRequired: true

        - name: isChangeTracking
          description: |-
            • Marks a column to be watched for changes that decide SCD type
            • 𝗠𝗮𝗿𝗸𝗲𝗱 — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟮 - a change expires the existing row and inserts a new version.
            • Not 𝗠𝗮𝗿𝗸𝗲𝗱 — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭 - a change updates the row in place.
            • Ignored on views.
          isRequired: false

        - name: lastModifiedTracking
          description: |-
            • Marks the column used to detect newer source rows for an 𝗶𝗻𝗰𝗿𝗲𝗺𝗲𝗻𝘁𝗮𝗹 𝗹𝗼𝗮𝗱.
            • 𝗗𝗮𝘁𝗮𝘁𝘆𝗽𝗲 - DATE/TIME or any incrementing NUMERIC type.
            • Can only be applied to one column.
            • Must not be NULL in the source — a pre-load check fails the run if it is, since a NULL value can never compare as newer.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: scdType
              type: number
              description: |-
                • Whether a changed row is updated in place or versioned.
                • 1 — 𝗼𝘃𝗲𝗿𝘄𝗿𝗶𝘁𝗲𝘀 the row in place.
                • 2 — 𝗲𝘅𝗽𝗶𝗿𝗲𝘀 the row and inserts a new version.
              isRequired: false
              default: 1

        - name: zeroKey
          description: |-
            • Adds a custom zero key value (ghost record) to this column, overriding the node-level 𝘇𝗲𝗿𝗼𝗞𝗲𝘆 defaults for it.
            • 𝗩𝗮𝗹𝘂𝗲 𝗶𝘀 𝗽𝗮𝘀𝘁𝗲𝗱 𝗶𝗻𝘁𝗼 𝘁𝗵𝗲 𝗦𝗤𝗟 𝗲𝘅𝗮𝗰𝘁𝗹𝘆 𝗮𝘀 𝘄𝗿𝗶𝘁𝘁𝗲𝗻 — no quotes, casing, or wrapping is added for you.
            • For a string, include your own quotes (e.g. "'N/A'"); for a date/time, write the full expression yourself (e.g. "CAST('1900-01-01' AS TIMESTAMP)"); a number or boolean can be given bare (e.g. 10, true).
            • Ignored unless zeroKey is enabled at the node level.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: value
              type: string
              description: Custom zero key value for this column, pasted into the SQL verbatim — supply your own quotes/casts as needed.
              isRequired: true
              example: "'N/A'"

        - name: isSurrogateKey
          description: |-
            ⚙ This is a system column.
            • Marks this column as the node's surrogate key.
            • Optional for SCD Type 1 — the merge logic joins and detects changes entirely off the business key.
            • Recommended for SCD Type 2 — a stable surrogate key per version is the standard way to support versioned business key. Not enforced — the merge itself doesn't require it.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝗼𝗻𝗹𝘆 𝘄𝗵𝗲𝗻 the node-level @zeroKey is set, since the zero/ghost record is matched against the target by surrogate key value.

            Expected expression:
            0 AS `{{NODE_NAME}}_KEY` @isSurrogateKey

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemVersion
          description: |-
            ⚙ This is a system column.
            • Marks this column as the SCD version number, incremented each time a business key gets a new version.
            • Required for SCD Type 2 — shows which version of a row this is. Each time a business key's row changes, the expired row is kept and a new row is inserted with this value incremented by 1.
            • Optional for SCD Type 1 — new-vs-existing is detected off the business key alone, so this column can be dropped entirely; if kept, it is always written as 1 and never incremented.
            • Value written under changeTracking/lastModified: 1 on a new key; previous version + 1 on a new SCD2 version.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified (upsert writes it as computed).
            • To use different values (e.g. 'Yes'/'No' flags or another end-date sentinel), use upsert and compute them in the SELECT/CTE.

            Expected expression:
            1 AS `SYSTEM_VERSION` @isSystemVersion

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemCurrentFlag
          description: |-
            ⚙ This is a system column.
            • Marks this column as the SCD "is current" flag — 'Y' on the active version of a row, overwritten to 'N' when it's expired.
            • Required for SCD Type 2 — used to filter the target down to each business key's one current row before comparing it against the incoming source row.
            • Optional for SCD Type 1 —  safe to omit; if kept, it is always written as 'Y'.
            • Value written under changeTracking/lastModified: 'Y' on the current row; 'N' on an expired SCD2 row.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified (upsert writes it as computed).
            • To use different values (e.g. 'Yes'/'No' flags or another end-date sentinel), use upsert and compute them in the SELECT/CTE.

            Expected expression:
            CAST('Y' AS STRING) AS `SYSTEM_CURRENT_FLAG` @isSystemCurrentFlag

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemCreateDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the timestamp a row (or, under SCD Type 2, a specific row version) was first created.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝘂𝗻𝗹𝗲𝘀𝘀 mergeStrategy 𝗶𝘀 𝘂𝗽𝘀𝗲𝗿𝘁
            • Value written under changeTracking/lastModified: CURRENT_TIMESTAMP on first insert, then kept unchanged.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified (upsert writes it as computed).
            • To use different values (e.g. 'Yes'/'No' flags or another end-date sentinel), use upsert and compute them in the SELECT/CTE.

            Expected expression:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_CREATE_DATE` @isSystemCreateDate

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemUpdateDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the timestamp a row was last updated.
            • Required for SCD Type 2 — read back from the target and refreshed to the current timestamp whenever a row is inserted as a new version or its prior current version is expired.
            • Required for SCD Type 1 — recomputed to the current timestamp on every inserted or changed row, so every row change carries an audit trail of when it was last updated.
            • Value written under changeTracking/lastModified: CURRENT_TIMESTAMP whenever the row is inserted, changed, or expired as an old SCD2 version.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified (upsert writes it as computed).
            • To use different values (e.g. 'Yes'/'No' flags or another end-date sentinel), use upsert and compute them in the SELECT/CTE.

            Expected expression:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_UPDATE_DATE` @isSystemUpdateDate

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemEndDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the SCD Type 2 expiration timestamp — a far-future sentinel while the row is current, set to the actual expiry time once superseded.
            • Required for SCD Type 2 — this is what makes a version's active window queryable; omitting it leaves expired versions with no expiry marker.
            • Optional for SCD Type 1 — (no versioning, so nothing ever expires) — safe to omit entirely.
            • Value written under changeTracking/lastModified: '2999-12-31 00:00:00' on the current row; the expiry time (one millisecond before the load) on an expired SCD2 row.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified (upsert writes it as computed).
            • To use different values (e.g. 'Yes'/'No' flags or another end-date sentinel), use upsert and compute them in the SELECT/CTE.

            Expected expression:
            CAST('2999-12-31 00:00:00' AS TIMESTAMP) AS `SYSTEM_END_DATE` @isSystemEndDate

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: not_null
          description: |-
            🚦 Column-level data quality test.
            Fails on rows where the column is 𝗡𝗨𝗟𝗟.
            Presence enables the test — remove the annotation to turn it off.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: uniqueness
          description: |- 
            🚦 Column-level data quality test.
            Fails when a value appears on more than one row.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: empty
          description: |-
            🚦 Column-level data quality test.
            Fails on rows where the column trims to the empty string;
            𝗡𝗨𝗟𝗟 values pass this test and are instead caught by not_null.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: accepted_values
          description: |-
            🚦 Column-level data quality test.
            Fails on rows whose value is outside the allow list.
            Repeat the annotation once per permitted value.
            Each value is pasted into the SQL verbatim, so quote it to match the column's data
            type — a number as accepted_values("<num>"), a string as accepted_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: rejected_values
          description: |-
            🚦 Column-level data quality test.
            Fails on rows whose value is in the deny list.
            Repeat the annotation once per forbidden value. Each value is pasted into the SQL verbatim, so quote it to match the column's data type — a number as rejected_values("<num>"), a string as
            rejected_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "'<string>'"

        - name: min_max
          description: |-
            🚦 Column-level data quality test.
            Fails on rows outside the inclusive range.
            Both bounds are pasted into the SQL verbatim, so write a number as "0" and a date as "DATE '2026-01-01'".
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: min_value
          description: |-
            🚦 Column-level data quality test.
            Fails on rows below the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"

        - name: max_value
          description: |-
            🚦 Column-level data quality test.
            Fails on rows above the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: freshness
          description: |-
            🚦 Column-level data quality test.
            Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all.
            𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: interval
              description: |-
                How far back from now the newest value is allowed to be, expressed in the unit given by 𝘂𝗻𝗶𝘁.
              type: number
              isRequired: true
              example: 1

            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: |-
            🚦 Column-level data quality test.
            Compares this column against another date/time column on the same node using the
            given operator.
            E.g. @relative_time("<=", "END_DATE") fails any row where this column's value is not less than or equal to END_DATE.
            A row with either side 𝗡𝗨𝗟𝗟 is left out of the check and passes.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: operator
              type: string
              description: Comparison operator used to compare this column against the other column.
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
              example: "="

            - name: column
              type: string
              description: Name of the other date/time column on this node to compare against.
              isRequired: true
              example: "<other_column>"

    sqlInitializationTemplate: |-
          {%- macro ref_raw(location_name, node_name) -%}
            {% raw %}{{ ref('{% endraw %}{{ location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
          {%- endmacro -%}
          {%- set ns = namespace(items=[], lines=[]) -%}
          {%- set idAnnotation = '@id("<ID>") ' -%}
          {%- set ns.items = ns.items + [{'expr': '0', 'alias': '`' ~ node.name ~ '_KEY`', 'annotation': idAnnotation ~ '@isSurrogateKey'}] -%}
          {%- for dep in sources[0].dependencies -%}
            {%- for col in dep.columns -%}
              {%- set ns.items = ns.items + [{'expr': '`' ~ col.name ~ '`', 'alias': '`' ~ col.name ~ '`', 'annotation': idAnnotation.rstrip()}] -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set ns.items = ns.items + [{'expr': '1', 'alias': '`SYSTEM_VERSION`', 'annotation': idAnnotation ~ '@isSystemVersion'}] -%}
          {%- set ns.items = ns.items + [{'expr': "CAST('Y' AS STRING)", 'alias': '`SYSTEM_CURRENT_FLAG`', 'annotation': idAnnotation ~ '@isSystemCurrentFlag'}] -%}
          {%- set ns.items = ns.items + [{'expr': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP)', 'alias': '`SYSTEM_CREATE_DATE`', 'annotation': idAnnotation ~ '@isSystemCreateDate'}] -%}
          {%- set ns.items = ns.items + [{'expr': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP)', 'alias': '`SYSTEM_UPDATE_DATE`', 'annotation': idAnnotation ~ '@isSystemUpdateDate'}] -%}
          {%- set ns.items = ns.items + [{'expr': "CAST('2999-12-31 00:00:00' AS TIMESTAMP)", 'alias': '`SYSTEM_END_DATE`', 'annotation': idAnnotation ~ '@isSystemEndDate'}] -%}
          {%- set maxExprLen = ns.items | map(attribute='expr') | map('length') | max -%}
          {%- set maxAliasLen = ns.items | map(attribute='alias') | map('length') | max -%}
          {%- for item in ns.items -%}
            {%- set line = (item.expr.ljust(maxExprLen) ~ ' AS ' ~ item.alias.ljust(maxAliasLen) ~ ' ' ~ item.annotation).rstrip() -%}
            {%- set ns.lines = ns.lines + [line] -%}
          {%- endfor -%}
          SELECT
              {{ ns.lines | join(',\n    ') }}
          {% for dep in sources[0].dependencies -%}
            {%- if loop.first -%}
              FROM {{ ref_raw(dep.node.location.name, dep.node.name) }} `{{ dep.node.name }}`
            {%- else %}
              INNER JOIN {{ ref_raw(dep.node.location.name, dep.node.name) }} `{{ dep.node.name }}`
              ON `{{ sources[0].dependencies[0].node.name }}`.JOIN_COLUMN = `{{ dep.node.name }}`.JOIN_COLUMN
            {%- endif -%}
          {%- endfor %}
name: Dimension
type: NodeType
