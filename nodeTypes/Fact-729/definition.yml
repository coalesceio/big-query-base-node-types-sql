fileVersion: 2
id: "729"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Fact
    plural: Facts
    short: fct
    tagColor: '#D9A438'

    enableCTESupport: true

    deployStrategy: advanced

    annotations:
        node:

        - name: materializationType
          description: |-
            How the target object is created.
          isRequired: false
          parameters:
            - name: type
              type: string
              isRequired: true
              default: table
              options:
                - table
                - view

        - name: partitionBy
          description: |-
            Partitions the target table by the given column or expression, written into 𝗣𝗔𝗥𝗧𝗜𝗧𝗜𝗢𝗡 𝗕𝗬 as-is.
            Examples:
              _PARTITIONDATE or DATE_TRUNC(_PARTITIONTIME, MONTH) — partition by load time
              ORDER_DATE, DATE(ts_col) or TIMESTAMP_TRUNC(ts_col, HOUR) — partition by a date/time column
              RANGE_BUCKET(int_col, GENERATE_ARRAY(0, 100, 10)) — partition by integer ranges
            ⚠️ On redeployment, partition changes drop and recreate the table.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: column/expression
              type: string
              description: Column name or partition expression.
              isRequired: true
              example: DATE_TRUNC(columnName, MONTH)

        - name: partitionExpirationDays
          description: |-
            Number of days to keep each partition before BigQuery deletes it.
            Applies only to ingestion-time and time-unit column partitions; ignored for an integer-range (RANGE_BUCKET) partition.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: days
              type: number
              description: Partition expiration in days.
              isRequired: true
              example: 30

        - name: tableExpiration
          description: |-
            Sets when BigQuery deletes the target table.
            A whole number expires the table that many days after it is created, e.g. 30;
            a date or datetime expires it at that fixed point, e.g. 2026-12-31 or 2026-12-31 23:59:59 — a date alone expires at 23:59:59 that day.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: value
              type: string
              description: Number of days from creation, or a date / datetime.
              isRequired: true
              example: "30"

        - name: defaultRoundingMode
          description: |-
            Default rounding mode for NUMERIC and BIGNUMERIC values written to the table.
            If not specified, BigQuery uses 𝗥𝗢𝗨𝗡𝗗_𝗛𝗔𝗟𝗙_𝗔𝗪𝗔𝗬_𝗙𝗥𝗢𝗠_𝗭𝗘𝗥𝗢.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Rounding mode applied to the table.
              isRequired: true
              default: ROUND_HALF_AWAY_FROM_ZERO
              example: ROUND_HALF_EVEN
              options:
                - ROUND_HALF_AWAY_FROM_ZERO
                - ROUND_HALF_EVEN

        - name: tag
          description: |-
            Applies a Resource Manager tag to this table through its 𝗢𝗣𝗧𝗜𝗢𝗡𝗦(𝘁𝗮𝗴𝘀 = [...]).
            Repeat the annotation to apply multiple tags; a tag key can only be used once per table.
            BigQuery tag keys are namespaced by project (<project-id>/<key>): a bare tag name is qualified with the
            project of this node's own location, and a name that already contains "/" (e.g. a key from another
            project or an organization) is used as-is.
            The tag key and value must already exist in GCP, and the deploying account needs permission to bind them.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
            - name: tagName
              type: string
              description: Short name of the tag key (must already exist in GCP), or a fully-qualified <project-or-org-id>/<key>.
              isRequired: true
              example: cost_center

            - name: tagValue
              type: string
              description: Short name of an existing value of that tag key.
              isRequired: true
              example: finance

        - name: writeMode
          description: |-
            Controls how data is written to the target table.
            𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁 clears the table before loading, replacing its contents entirely;
            𝗮𝗽𝗽𝗲𝗻𝗱 loads the new rows alongside whatever is already there.
            If not specified in the SQL, defaults to 𝗮𝗽𝗽𝗲𝗻𝗱.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before loading, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
              isRequired: true
              default: append
              example: truncateInsert
              options:
                - truncateInsert
                - append

        - name: mergeStrategy
          description: |-
            • Picks how a node with a business key is merged into the target. Every strategy is SCD Type 1 — a matched row is updated in place, never versioned.
            • If not specified: a node with an isBusinessKey column defaults to 𝗰𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴; a node with no isBusinessKey column is loaded as a plain 𝗜𝗡𝗦𝗘𝗥𝗧.
            • The value is not case-sensitive; any other value fails the run.
            • Every strategy merges on the business key, so the run fails if a strategy is set but no column is marked isBusinessKey.
            • The SELECT/CTE must return exactly one row per business key, with no NULL business key — a pre-load test can handle this.
            • Ignored on views.

            ◆ 𝗰𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴
              • Compares every plain attribute column; a matched row is updated only when one of them changed.
              • Requires no lastModifiedTracking column.

            ◆ 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱
              • Compares a single lastModifiedTracking column against the target's stored value; a matched row is updated only when the source value is newer.
              • Requires exactly one column marked lastModifiedTracking — the run fails if none is present.

            ◆ 𝘂𝗽𝘀𝗲𝗿𝘁
              • No change detection — a matched row is always updated, an unmatched row is inserted.
              • SYSTEM_CREATE_DATE keeps its first-inserted value on update.
              • Requires no lastModifiedTracking column.

            Agentic creation — before writing a new Fact node's SELECT, ask the user (don't silently default):
            1. Which merge strategy do they want — upsert, changeTracking or lastModified? If they don't know, explain the three options above and let them choose.
            2. If they want a plain insert with no merge, leave out both this annotation and isBusinessKey — setting a strategy without a business key fails the run.
          isRequired: false
          parameters:
            - name: strategy
              type: string
              description: Which merge method to use.
              isRequired: true
              default: changeTracking
              options:
                - changeTracking
                - lastModified
                - upsert

        - name: disableTests
          type: boolean
          description: |-
            Controls whether configured tests are skipped.
            Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
          isRequired: false
          default: false

        - name: tests
          description: |-
            Node-level data quality test.
            Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗿𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
            Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: preSQL
          description: |-
            SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
            Repeat the annotation to run multiple statements in the order they appear.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: |-
            SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
                Repeat the annotation to run multiple statements in the order they appear.
                𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: primaryKey
          description: |-
            Marks this column as part of the table's primary key, at the given position
            (lowest first), e.g. primaryKey(1).
            Mark every key column to build a composite key, e.g. primaryKey(1) on one column and primaryKey(2) on another.
            Presence enables the key — remove the annotation to drop the column from it.
            𝗡𝗼𝘁 𝗲𝗻𝗳𝗼𝗿𝗰𝗲𝗱 — BigQuery does not validate uniqueness; pair with uniqueness / not_null to test it.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: position
              type: number
              isRequired: true
              example: 1

        - name: clusterKey
          description: |-
            Marks this column as part of the table's CLUSTER BY key, at the given position
            (lowest first), e.g. clusterKey(1).
            BigQuery clusters by plain top-level columns only — no expressions — and allows at most 4 clustering columns.
            ⚠️ On redeployment, clustering changes drop and recreate the table.
            Ignored on views.
          parameters:
            - name: position
              type: number
              isRequired: true
              example: 1

        - name: isBusinessKey
          description: |-
            • Marks a column as part of the business key used to match existing rows.
            • 𝗕𝘂𝘀𝗶𝗻𝗲𝘀𝘀 𝗸𝗲𝘆 𝗺𝗮𝗿𝗸𝗲𝗱 — rows are loaded with a 𝗠𝗘𝗥𝗚𝗘: matched rows are updated, new rows are inserted.
            • 𝗡𝗼 𝗯𝘂𝘀𝗶𝗻𝗲𝘀𝘀 𝗸𝗲𝘆 — rows are loaded with a plain 𝗜𝗡𝗦𝗘𝗥𝗧.
            • Mark more than one column for a composite key.
            • Ignored on views.
          isRequired: false

        - name: lastModifiedTracking
          description: |-
            • Marks the column compared against the target to decide whether a matched row is updated — only rows whose value is newer than the stored one are updated.
            • Used by mergeStrategy 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱, which needs a business key; ignored for a plain INSERT.
            • 𝗗𝗮𝘁𝗮𝘁𝘆𝗽𝗲 - TIMESTAMP or NUMERIC.
            • Can only be applied to one column.
            • Ignored on views.
          isRequired: false

        - name: isSystemCreateDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the timestamp a row was first inserted; kept unchanged when the row is later updated.

            Expected expression:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_CREATE_DATE` @isSystemCreateDate

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemUpdateDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the timestamp a row was last inserted or updated.

            Expected expression:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS `SYSTEM_UPDATE_DATE` @isSystemUpdateDate

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: not_null
          description: |-
            🚦 Column-level data quality test.
            Fails on rows where the column is 𝗡𝗨𝗟𝗟.
            Presence enables the test — remove the annotation to turn it off.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: uniqueness
          description: |- 
            🚦 Column-level data quality test.
            Fails when a value appears on more than one row.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: empty
          description: |-
            🚦 Column-level data quality test.
            Fails on rows where the column trims to the empty string;
            𝗡𝗨𝗟𝗟 values pass this test and are instead caught by not_null.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: accepted_values
          description: |-
            🚦 Column-level data quality test.
            Fails on rows whose value is outside the allow list.
            Repeat the annotation once per permitted value.
            Each value is pasted into the SQL verbatim, so quote it to match the column's data
            type — a number as accepted_values("<num>"), a string as accepted_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: rejected_values
          description: |-
            🚦 Column-level data quality test.
            Fails on rows whose value is in the deny list.
            Repeat the annotation once per forbidden value. Each value is pasted into the SQL verbatim, so quote it to match the column's data type — a number as rejected_values("<num>"), a string as
            rejected_values("'<string>'").
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "'<string>'"

        - name: min_max
          description: |-
            🚦 Column-level data quality test.
            Fails on rows outside the inclusive range.
            Both bounds are pasted into the SQL verbatim, so write a number as "0" and a date as "DATE '2026-01-01'".
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: min_value
          description: |-
            🚦 Column-level data quality test.
            Fails on rows below the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: "0"

        - name: max_value
          description: |-
            🚦 Column-level data quality test.
            Fails on rows above the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: "100"

        - name: freshness
          description: |-
            🚦 Column-level data quality test.
            Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all.
            𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: interval
              description: |-
                How far back from now the newest value is allowed to be, expressed in the unit given by 𝘂𝗻𝗶𝘁.
              type: number
              isRequired: true
              example: 1

            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: |-
            🚦 Column-level data quality test.
            Compares this column against another date/time column on the same node using the
            given operator.
            E.g. @relative_time("<=", "END_DATE") fails any row where this column's value is not less than or equal to END_DATE.
            A row with either side 𝗡𝗨𝗟𝗟 is left out of the check and passes.
            Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: operator
              type: string
              description: Comparison operator used to compare this column against the other column.
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
              example: "="

            - name: column
              type: string
              description: Name of the other date/time column on this node to compare against.
              isRequired: true
              example: "<other_column>"

    sqlInitializationTemplate: |-
          {%- macro ref_raw(location_name, node_name) -%}
            {% raw %}{{ ref('{% endraw %}{{ location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
          {%- endmacro -%}
          {%- set ns = namespace(items=[], lines=[]) -%}
          {%- set idAnnotation = '@id("<ID>") ' -%}
          {%- for dep in sources[0].dependencies -%}
            {%- for col in dep.columns -%}
              {%- set ns.items = ns.items + [{'expr': '`' ~ col.name ~ '`', 'alias': '`' ~ col.name ~ '`', 'annotation': idAnnotation.rstrip()}] -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set ns.items = ns.items + [{'expr': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP)', 'alias': '`SYSTEM_CREATE_DATE`', 'annotation': idAnnotation ~ '@isSystemCreateDate'}] -%}
          {%- set ns.items = ns.items + [{'expr': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP)', 'alias': '`SYSTEM_UPDATE_DATE`', 'annotation': idAnnotation ~ '@isSystemUpdateDate'}] -%}
          {%- set maxExprLen = ns.items | map(attribute='expr') | map('length') | max -%}
          {%- set maxAliasLen = ns.items | map(attribute='alias') | map('length') | max -%}
          {%- for item in ns.items -%}
            {%- set line = (item.expr.ljust(maxExprLen) ~ ' AS ' ~ item.alias.ljust(maxAliasLen) ~ ' ' ~ item.annotation).rstrip() -%}
            {%- set ns.lines = ns.lines + [line] -%}
          {%- endfor -%}
          SELECT
              {{ ns.lines | join(',\n    ') }}
          {% for dep in sources[0].dependencies -%}
            {%- if loop.first -%}
              FROM {{ ref_raw(dep.node.location.name, dep.node.name) }} `{{ dep.node.name }}`
            {%- else %}
              INNER JOIN {{ ref_raw(dep.node.location.name, dep.node.name) }} `{{ dep.node.name }}`
              ON `{{ sources[0].dependencies[0].node.name }}`.JOIN_COLUMN = `{{ dep.node.name }}`.JOIN_COLUMN
            {%- endif -%}
          {%- endfor %}
name: Fact
type: NodeType
