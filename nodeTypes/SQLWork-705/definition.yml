fileVersion: 2
id: "705"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: SQL Work
    short: WRK
    plural: Works
    tagColor: '#2EB67D'

    enableCTESupport: true

    annotations:
        node:

        - name: writeMode
          description: Controls how data is written to the target table. If not specified in the SQL, defaults to 𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
              isRequired: true
              default: truncateInsert
              example: append
              options:
                - truncateInsert
                - append

        - name: disableTests
          type: boolean
          description: Controls whether configured tests are skipped.
          isRequired: false
          default: false

        - name: tests
          description: The test fails if the query returns any records. Applicable only when 𝘁𝗲𝘀𝘁𝘀𝗘𝗻𝗮𝗯𝗹𝗲𝗱 is enabled.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: columnRunOrder
          description: Determines whether the column test is executed before or after the load operation. When not specified in editor default to 𝗔𝗳𝘁𝗲𝗿. Applicable only when 𝘁𝗲𝘀𝘁𝘀𝗘𝗻𝗮𝗯𝗹𝗲𝗱 is enabled.
          parameters:
            - name: runOrder
              type: string
              description: Order for column test execution
              isRequired: true
              default: After
              example: Before
              options:
                - Before
                - After

        - name: columnContinueOnFailure
          description: Carry on with the remaining stages when a column test returns rows. On unless you write @continueOnFailure(false).
          parameters:
            - name: isEnabled
              type: boolean
              default: true

        - name: preSQL
          description: SQL statement to execute before data load operation. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: SQL statement to execute after data load operation. 𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: inHash
          description: Marks columns for hash key generation. Use the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡() macro to generate the hash column from the marked columns. 𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Common name assigned to the generated hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Order of columns used to calculate the hash.
              example: 1

        - name: not_null
          description: >-
            Fails on rows where the column is NULL. Presence enables the test — remove the annotation
            to turn it off.

        - name: unique
          description: Fails when a value appears on more than one row.

        - name: empty
          description: >-
            Fails on rows where the column trims to the empty string. NULLs are the not_null test's
            business, not this one's.

        - name: accepted_values
          description: >-
            Fails on rows whose value is outside the allow list. Repeat the annotation once per
            permitted value. Values are compared as strings.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "<value>"

        - name: rejected_values
          description: >-
            Fails on rows whose value is in the deny list. Repeat the annotation once per forbidden
            value. Values are compared as strings.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "<value>"

        - name: min_max
          description: >-
            Fails on rows outside the inclusive range. Both bounds are pasted into the SQL verbatim,
            so write a number as "0" and a date as "DATE '2026-01-01'".
          parameters:
            - name: min
              type: string
              isRequired: true
              example: "0"
            - name: max
              type: string
              isRequired: true
              example: "100"

        - name: min_value
          description: >-
            Fails on rows below the bound. Pasted into the SQL verbatim — see min_max.
          parameters:
            - name: min
              type: string
              isRequired: true
              example: "0"

        - name: max_value
          description: >-
            Fails on rows above the bound. Pasted into the SQL verbatim — see min_max.
          parameters:
            - name: max
              type: string
              isRequired: true
              example: "100"

        - name: freshness
          description: >-
            Fails when the newest value in the column is older than the given age, or when the table
            is empty. For load timestamps and other date/time columns.
          parameters:
            - name: interval
              type: number
              isRequired: true
              example: 1
            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: >-
            Fails on rows where this column does not hold the given relationship to another column of
            the same node, e.g. @relative_time("<=", "END_DATE"). Rows where either side is NULL pass.
          parameters:
            - name: operator
              type: string
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
            - name: column
              type: string
              isRequired: true
              example: "<OTHER_COLUMN>"

        - name: business_rule
          description: >-
            Fails on rows where the boolean expression is not true. The expression is pasted into a
            WHERE NOT (...) against the target table. Repeatable.
          allowsMultiple: true
          parameters:
            - name: expression
              type: string
              isRequired: true
              example: "LENGTH(C_PHONE) = 15"
            - name: label
              type: string
              description: Stage name for this rule. Defaults to business_rule.
              example: "<phone is fully qualified>"

        - name: business_query
          description: >-
            A complete query, run as written, that returns rows only when the check fails. Repeatable.
          allowsMultiple: true
          parameters:
            - name: query
              type: string
              isRequired: true
              example: "SELECT 1 FROM {{ this }} WHERE FALSE"
            - name: label
              type: string
              description: Stage name for this query. Defaults to business_query.
              example: "<what this proves>"

        - name: relationship
          description: >-
            Referential integrity. Fails on rows whose non-NULL value has no match in the parent
            column, e.g. @relationship("SRC", "CUSTOMER", "C_CUSTKEY"). Repeatable.
          allowsMultiple: true
          parameters:
            - name: location
              type: string
              isRequired: true
              example: "<STORAGE_LOCATION>"
            - name: node
              type: string
              isRequired: true
              example: "<PARENT_NODE>"
            - name: column
              type: string
              isRequired: true
              example: "<PARENT_COLUMN>"
name: SQL Work
type: NodeType
