fileVersion: 2
id: "705"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: SQL Work
    short: WRK
    plural: Works
    tagColor: '#2EB67D'

    enableCTESupport: true

    annotations:
        node:

        - name: writeMode
          description: >-
            Controls how data is written to the target table. 
            𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁 clears the table before loading, replacing its contents entirely;
            𝗮𝗽𝗽𝗲𝗻𝗱 inserts the new rows alongside whatever is already there.
            If not specified in the SQL, defaults to 𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁. 
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
              isRequired: true
              default: truncateInsert
              example: append
              options:
                - truncateInsert
                - append

        - name: disableTests
          type: boolean
          description: >-
            Controls whether configured tests are skipped.
            Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
          isRequired: false
          default: false

        - name: tests
          description: >-
            Node-level data quality test.
            Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗿𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
            Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true
              parameters:
              options:
                - true
                - false

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: columnRunOrder
          description: >-
            Determines whether column-level tests (𝘂𝗻𝗶𝗾𝘂𝗲, 𝗻𝗼𝘁_𝗻𝘂𝗹𝗹, 𝗲𝗺𝗽𝘁𝘆, 𝗮𝗰𝗰𝗲𝗽𝘁𝗲𝗱_𝘃𝗮𝗹𝘂𝗲𝘀, etc.) run 𝗕𝗲𝗳𝗼𝗿𝗲 the load — checking existing/source data before it lands in the target — or 𝗔𝗳𝘁𝗲𝗿 the load, validating the freshly written rows.
            Applies node-wide to every column test on this node;
            When not specified in the SQL, defaults to 𝗔𝗳𝘁𝗲𝗿.
          parameters:
            - name: runOrder
              type: string
              description: Order for column test execution
              isRequired: true
              default: After
              example: Before
              options:
                - Before
                - After

        - name: columnContinueOnFailure
          description: >-
            Determines whether the run carries on with the remaining stages when a column test returns rows, or halts the run right there.
            Applies node-wide to every column test on this node;
            On (continues) unless you write @columnContinueOnFailure(false).
          parameters:
            - name: isEnabled
              type: boolean
              default: true
              example: false

        - name: preSQL
          description: >-
            SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
            Repeat the annotation to run multiple statements in the order they appear.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: >-
            SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
            Repeat the annotation to run multiple statements in the order they appear.
            𝗜𝗴𝗻𝗼𝗿𝗲𝗱 𝗼𝗻 𝘃𝗶𝗲𝘄𝘀.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: inHash
          description: >-
            Marks a column as an input to a generated hash key, grouped by 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲 and ordered within that group by 𝗵𝗮𝘀𝗵𝗢𝗿𝗱𝗲𝗿.
            Mark every column that should feed a given hash with the same 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲, then call the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡("<hashName>") macro elsewhere in the SELECT to produce the actual hash column from those marked columns.
            𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Group hash name shared by every column feeding the same hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Position of this column within its hash group, lowest first.
              example: 1

        - name: not_null
          description: >-
            Column-level data quality test.
            Fails on rows where the column is NULL.
            Presence enables the test — remove the annotation to turn it off.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and  either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.

        - name: unique
          description: >- 
            Column-level data quality test.
            Fails when a value appears on more than one row.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.

        - name: empty
          description: >-
            Column-level data quality test.
            Fails on rows where the column trims to the empty string;
            NULL values pass this test and are instead caught by not_null.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.

        - name: accepted_values
          description: >-
            Column-level data quality test.
            Fails on rows whose value is outside the allow list.
            Repeat the annotation once per permitted value.
            Each value is pasted into the SQL verbatim, so quote it to match the column's data
            type — a number as accepted_values("<num>"), a string as accepted_values("'<string>'").
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: rejected_values
          description: >-
            Column-level data quality test.
            Fails on rows whose value is in the deny list.
            Repeat the annotation once per forbidden value. Each value is pasted into the SQL verbatim, so quote it to match the column's data type — a number as rejected_values("<num>"), a string as
            rejected_values("'<string>'").
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true
              example: "'<string>'"

        - name: min_max
          description: >-
            Column-level data quality test.
            Fails on rows outside the inclusive range.
            Both bounds are pasted into the SQL verbatim, so write a number as "0" and a date as "DATE '2026-01-01'".
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          parameters:
            - name: min
              type: string
              isRequired: true
              example: "0"
            - name: max
              type: string
              isRequired: true
              example: "100"

        - name: min_value
          description: >-
            Column-level data quality test.
            Fails on rows below the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          parameters:
            - name: min
              type: string
              isRequired: true
              example: "0"

        - name: max_value
          description: >-
            Column-level data quality test.
            Fails on rows above the bound.
            Pasted into the SQL verbatim — see min_max.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          parameters:
            - name: max
              type: string
              isRequired: true
              example: "100"

        - name: freshness
          description: >-
            Column-level data quality test.
            Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all.
            𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          parameters:
            - name: interval
              type: number
              isRequired: true
              example: 1

            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: >-
            Column-level data quality test.
            Fails on rows where this column does not hold the given relationship to another column of the same node, e.g. @relative_time("<=", "END_DATE").
            Rows where either side is NULL pass.
            Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          parameters:
            - name: operator
              type: string
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
            - name: column
              type: string
              isRequired: true
              example: "<OTHER_COLUMN>"

        - name: business_rule
          description: >-
            Column-level data quality test. Fails on rows where the boolean expression is not true. The
            expression is pasted into a WHERE NOT (...) against the target table. Repeatable. Runs
            𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or continues the run on
            failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          allowsMultiple: true
          parameters:
            - name: expression
              type: string
              isRequired: true
              example: "LENGTH(C_PHONE) = 15"
            - name: label
              type: string
              description: Stage name for this rule. Defaults to business_rule.
              example: "<phone is fully qualified>"

        - name: business_query
          description: >-
            Column-level data quality test. A complete query, run as written, that returns rows only when the
            check fails. Repeatable. Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either
            halts or continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          allowsMultiple: true
          parameters:
            - name: query
              type: string
              isRequired: true
              example: "SELECT 1 FROM {{ this }} WHERE FALSE"
            - name: label
              type: string
              description: Stage name for this query. Defaults to business_query.
              example: "<what this proves>"

        - name: relationship
          description: >-
            Column-level data quality test. Referential integrity — fails on rows whose non-NULL value has no
            match in the parent column, e.g. @relationship("SRC", "CUSTOMER", "C_CUSTKEY").
            Repeatable. Runs 𝗕𝗲𝗳𝗼𝗿𝗲 or 𝗔𝗳𝘁𝗲𝗿 the load per 𝗰𝗼𝗹𝘂𝗺𝗻𝗥𝘂𝗻𝗢𝗿𝗱𝗲𝗿, and either halts or
            continues the run on failure per 𝗰𝗼𝗹𝘂𝗺𝗻𝗖𝗼𝗻𝘁𝗶𝗻𝘂𝗲𝗢𝗻𝗙𝗮𝗶𝗹𝘂𝗿𝗲.
          allowsMultiple: true
          parameters:
            - name: location
              type: string
              isRequired: true
              example: "<STORAGE_LOCATION>"
            - name: node
              type: string
              isRequired: true
              example: "<PARENT_NODE>"
            - name: column
              type: string
              isRequired: true
              example: "<PARENT_COLUMN>"
name: SQL Work
type: NodeType
